<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background-color: #000000;
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    letter-spacing: 1px;
}

.split-container {
    display: flex;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

.left-half,
.right-half {
    width: 50%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.left-half {
    background-color: #000000;
    padding: 0;
    overflow: hidden;
    align-items: stretch;
    justify-content: stretch;
}

.right-half {
    background-color: #000000;
    padding: 20px 24px;
    height: calc(100vh - 80px);
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    border: 3px solid #004cff;
    box-shadow: 0 0 10px #004cff, 0 0 20px #004cff, inset 0 0 10px rgba(0, 76, 255, 0.2);
    border-radius: 12px;
    margin: 40px 40px 40px 20px;
    background: rgba(0, 0, 0, 0.7);
    width: 85%;
    max-width: 650px; 
    min-width: 420px;
    min-height: 0;
    align-self: flex-start;
    overflow-y: hidden;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: #004cff #000000;
}

.menu-panel {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: flex-start;
    text-align: left;
    min-height: 100%;
    justify-content: center;
    position: relative;
}

.sub-menu {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 6px;
    padding-left: 2px;
    align-items: flex-start;
}

.menu-panel .menu-item,
.sub-menu .menu-item {
    align-self: flex-start;
    text-align: left;
    white-space: nowrap;
}

.menu-panel h1 {
    align-self: center;
    margin-left: 0;
    text-align: center;
}

.profile-menu-panel {
    position: relative;
}

.profile-menu-panel > .sub-menu {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    margin-top: 0;
    transform: translateY(-50%);
}

.panel-content-only {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.top-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.back-button {
    background: transparent;
    border: 2px solid #004cff;
    color: #004cff;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 0 8px #004cff;
}

.back-button:hover {
    background: rgba(0, 76, 255, 0.1);
}

.whoami-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: 42% center;
    min-height: 100vh;
}

h1 {
    margin: 0 0 18px 0;
    font-size: 40px;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 0 8px #ffffff;
}

h2 {
    margin: 0 0 16px;
    font-size: 30px;
    color: #004cff;
    text-transform: uppercase;
}

h3 {
    margin: 0 0 8px;
    font-size: 12px;
    color: #ffffff;
    text-transform: uppercase;
}

.menu-item {
    background: transparent;
    border: none;
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    text-align: left;
    padding: 0;
    cursor: pointer;
    font-size: 30px;
    text-transform: uppercase;
    transition: all 0.2s ease;
    position: relative;
    letter-spacing: 1px;
    outline: none;
    display: block;
    width: fit-content;
    line-height: 2;
}

.menu-item::before {
    content: '>';
    opacity: 0;
    color: #004cff;
    margin-right: 8px;
    transition: opacity 0.2s ease;
}

.menu-item:hover::before,
.menu-item.active::before,
.menu-item:focus::before {
    opacity: 1;
}

.menu-item:hover,
.menu-item.active,
.menu-item:focus {
    color: #004cff;
    transform: translateX(4px);
    text-shadow: 0 0 8px #004cff;
}

.sub-menu .menu-item {
    display: block;
    width: fit-content;
}

.panel-content {
    width: 100%;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.fact-box {
    border: 2px solid #004cff;
    background: rgba(0, 0, 0, 0.55);
    box-shadow: inset 0 0 8px rgba(0, 76, 255, 0.12);
    padding: 14px 12px;
    border-radius: 8px;
}

.know-me-box {
    position: relative;
    overflow: visible;
    padding-right: 110px;
}

.blue-cat-cap-image {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 130px;
    height: 130px;
    object-fit: contain;
    opacity: 0.95;
    filter: drop-shadow(0 0 8px rgba(0, 76, 255, 0.35));
    pointer-events: none;
}

.know-me-grid {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.know-me-grid p {
    margin: 0;
    line-height: 1.8;
}

.social-links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
}

.social-link {
    display: block;
    width: fit-content;
    color: #ffffff;
    text-decoration: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    line-height: 1.6;
    border: 2px solid #004cff;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 8px;
    padding: 8px 10px;
    transition: all 0.2s ease;
    box-shadow: 0 0 8px rgba(0, 76, 255, 0.25);
}

.social-link:hover,
.social-link:focus {
    color: #004cff;
    transform: translateX(4px);
    text-shadow: 0 0 8px #004cff;
    background: rgba(0, 76, 255, 0.08);
}

.fact-box p,
.fact-box li {
    color: #ffffff;
    font-size: 20px;
    line-height: 1.8;
    margin: 0;
    text-transform: none;
    letter-spacing: 0.5px;
}

.panel-content .fact-box p {
    font-size: 20px;
    line-height: 1.6;
}

.panel-content .fact-box li,
.panel-content .fact-box ul,
.panel-content .fact-box p {
    font-size: 20px;
}

.fact-box ul {
    margin: 0;
    padding-left: 18px;
}

.fact-box li + li {
    margin-top: 8px;
}

.known-facts-panel,
.unknown-facts-panel {
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.scrollable-facts-box {
    flex: 1 1 0;
    max-height: 100%;
    min-height: 0;
    overflow-y: scroll;
    overflow-x: hidden;
    scrollbar-width: auto;
    scrollbar-color: #7fb7ff #050b17;
    scrollbar-gutter: stable;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
}

.scrollable-facts-box::-webkit-scrollbar {
    width: 12px;
}

.scrollable-facts-box::-webkit-scrollbar-track {
    background: #050b17;
    border: 2px solid rgba(0, 76, 255, 0.35);
    border-radius: 999px;
}

.scrollable-facts-box::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #94c1ff, #004cff, #0031a6);
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 10px rgba(0, 76, 255, 0.9);
}

.socials-box {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: auto;
    scrollbar-color: #7fb7ff #050b17;
    scrollbar-gutter: stable;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
}

.socials-box::-webkit-scrollbar {
    width: 12px;
}

.socials-box::-webkit-scrollbar-track {
    background: #050b17;
    border: 2px solid rgba(0, 76, 255, 0.35);
    border-radius: 999px;
}

.socials-box::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #94c1ff, #004cff, #0031a6);
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 10px rgba(0, 76, 255, 0.9);
}

.message-box {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.message-label {
    color: #ffffff;
    font-size: 12px;
    line-height: 1.7;
    letter-spacing: 1px;
}

.message-textarea {
    width: 100%;
    min-height: 170px;
    resize: vertical;
    border: 2px solid #004cff;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.55);
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    line-height: 1.8;
    padding: 14px 12px;
    box-shadow: inset 0 0 8px rgba(0, 76, 255, 0.15);
}

.message-textarea::placeholder {
    color: rgba(255, 255, 255, 0.55);
}

.message-textarea:focus {
    outline: none;
    border-color: #7aa8ff;
    box-shadow: 0 0 0 2px rgba(0, 76, 255, 0.2), inset 0 0 8px rgba(0, 76, 255, 0.2);
}

.message-submit {
    align-self: flex-start;
    border: 2px solid #004cff;
    background: rgba(0, 76, 255, 0.08);
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(0, 76, 255, 0.3);
    transition: all 0.2s ease;
}

.message-submit:hover,
.message-submit:focus {
    color: #004cff;
    transform: translateX(4px);
    text-shadow: 0 0 8px #004cff;
}

@media (max-width: 700px) {
    body {
        height: auto;
        min-height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
        background-image: linear-gradient(rgba(0, 0, 0, 0.58), rgba(0, 0, 0, 0.78)), url('pacman-pac.gif');
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
    }

    .split-container {
        min-height: 100dvh;
        height: auto;
        flex-direction: column;
        overflow: visible;
        background: transparent;
    }

    .left-half,
    .right-half {
        width: 100%;
        min-width: 0;
    }

    .left-half {
        display: none;
    }

    .whoami-image {
        min-height: 0;
        height: 100%;
        object-position: center center;
    }

    .right-half {
        height: 100dvh;
        min-height: 100dvh;
        flex: 1 1 100dvh;
        margin: 0;
        padding: 18px 14px;
        border-radius: 0;
        align-self: stretch;
        align-items: center;
        background: rgba(0, 0, 0, 0.72);
    }

    .menu-panel,
    .panel-content-only {
        align-items: flex-start;
        text-align: left;
    }

    .menu-panel {
        min-height: 100%;
        justify-content: center;
    }

    .panel-content-only {
        position: relative;
    }

    .menu-item,
    .sub-menu .menu-item {
        align-self: flex-start;
        text-align: left;
    }

    .sub-menu {
        align-items: flex-start;
        padding-left: 0;
    }

    .panel-content-only > .sub-menu {
        position: absolute;
        top: 50%;
        left: calc(50% - 40px);
        width: calc(100% - 28px);
        margin-top: 0;
        transform: translate(-50%, -50%);
    }

    .top-row {
        align-self: stretch;
        justify-content: flex-start;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 14px;
    }

    h2 {
        font-size: 22px;
        margin-bottom: 12px;
    }

    .menu-panel,
    .sub-menu {
        gap: 12px;
    }

    .menu-item {
        font-size: 20px;
        line-height: 1.7;
    }

    .fact-box p,
    .fact-box li,
    .panel-content .fact-box li,
    .panel-content .fact-box ul,
    .panel-content .fact-box p {
        font-size: 16px;
        line-height: 1.65;
    }

    .know-me-box {
        padding-right: 150px;
    }

    .blue-cat-cap-image {
        width: 105px;
        height: 105px;
        right: 6px;
    }

    .social-link {
        font-size: 13px;
    }

    .message-label,
    .message-submit,
    .message-textarea {
        font-size: 10px;
    }

    .message-textarea {
        min-height: 140px;
    }

}

    </style>
    <title>Whoami</title>
</head>

<body>

    <script>
        const registeredEmail = 'danyaellap@gmail.com';

        const profileSections = {
            knowMe: `
                <div class="panel-content">
                    <h2>GET TO KNOW ME</h2>
                    <div class="fact-box know-me-box">

                    <div class="fact-box scrollable-facts-box">
                        <ul>
                            <li>Currently, I'm a 2nd Year College Student.</li>
                            <li>I enjoy making stuff, especially related  to music and interior design</li>
                            <li>I also like experimenting stuff overall.</li>
                            <li>English is not my first languange so I have sometimes a hard time talking to.</li>
                            <li>I rarely open dms so if I don't reply, please don't take it personally.</li>

            `,

                <div class="panel-content unknown-facts-panel">

                        <ul>
                            <li>I like to collect stuff related to games, especially card games, legos, and tech devices</li>

            `,

                <div class="panel-content who-i-ult-panel">
                    <h2>WHO I ULT</h2>
                    <div class="fact-box scrollable-facts-box">
                        <ul>
                            <li>Current main bias (K-Pop): Winter, Seulgi, Mina, Yoon, Minji, Kazuha, Chaewon, Minju, Haewon, Lily .</li>
                            <li>Other main biases: Krystal, Caprice, Freen, Becky, Mikha, Gwen, Colet, Milk, Love, Pangjie, Mable, Aiah</li>
                            <li>Current main ult groups: aespa, Nmixx, Red Velvet, Stayc, Twice, and Cortis.</li>
                            <li>Other groups I stan: Blackpink, Itzy, Le Sserafim, NewJeans, Loona, Kep1er, Iz*one, IVE, GFriend, Mamamoo, WJSN, and SNSD.</li>
                            <li>Other ult groups: ILLIT, NCT and its sub-units, Seventeen, Stray Kids, EXO, and Tomorrow X Together.</li>
                        </ul>
                    </div>
                </div>
            `,
            socials: `
                <div class="panel-content">
                    <h2>SOCIALS</h2>
                    <div class="fact-box socials-box">
                        <div class="social-links">
                            <a class="social-link" href="mailto:danyaellap@gmail.com" target="_blank" rel="noopener noreferrer">EMAIL</a>
                            <a class="social-link" href="https://www.instagram.com/dandandalandamn/" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
                            <a class="social-link" href="https://github.com/heyoanon/heyoanon" target="_blank" rel="noopener noreferrer">GITHUB</a>
                            <a class="social-link" href="https://discord.com/users/772073053097033741" target="_blank" rel="noopener noreferrer">DISCORD</a>
                            <a class="social-link" href="https://open.spotify.com/user/31xlsqnowc5autb22oupuge64fvq" target="_blank" rel="noopener noreferrer">SPOTIFY</a>
                            <a class="social-link" href="https://www.youtube.com/@anoanondan" target="_blank" rel="noopener noreferrer">YOUTUBE</a>

            `,
            sidequests: `
                <div class="panel-content">
                    <h2>SIDE QUESTS</h2>
                    <div class="fact-box">
                        <h3>MISSION LOG</h3>
                        <ul>
                            <li>Expand my knowledge in coding and designing.</li>
                            <li>Make a website based on what it needs.</li>
                            <li>Keep learning unexpectedly.</li>
                        </ul>
                    </div>
                </div>
            `,
            message: `
                <div class="panel-content">
                    <h2>MESSAGE ME</h2>
                    <div class="fact-box message-box">
                        <label for="message-input" class="message-label">TYPE YOUR MESSAGE</label>
                        <textarea id="message-input" class="message-textarea" placeholder="Write something nice..."></textarea>
                        <button type="button" class="message-submit">SEND</button>
                    </div>
                </div>
            `
        };

        const rightPanel = document.getElementById('right-panel');
        let arcadeAudioContext;

        function playArcadeBeep() {
            arcadeAudioContext ||= new AudioContext();
            const oscillator = arcadeAudioContext.createOscillator();
            const gain = arcadeAudioContext.createGain();
            const startTime = arcadeAudioContext.currentTime;

            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(620, startTime);
            oscillator.frequency.exponentialRampToValueAtTime(330, startTime + 0.08);
            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(0.12, startTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.09);
            oscillator.connect(gain);
            gain.connect(arcadeAudioContext.destination);
            oscillator.start(startTime);
            oscillator.stop(startTime + 0.1);
        }

        function renderMainMenu() {
            rightPanel.innerHTML = `
                <div class="menu-panel">
                    <h1>WHOAMI</h1>
                    <button class="menu-item" data-page="profile">PROFILE</button>
                    <button class="menu-item" data-page="socials">SOCIALS</button>
                    <button class="menu-item" data-page="sidequests">SIDE QUESTS</button>
                    <button class="menu-item" data-page="message">MESSAGE ME</button>
                </div>
            `;

            document.querySelectorAll('.menu-item').forEach(button => {
                button.addEventListener('click', () => {
                    playArcadeBeep();
                    renderPage(button.dataset.page);
                });
            });
        }

        async function sendMessageToCreator() {
            const textarea = document.getElementById('message-input');
            const message = textarea ? textarea.value.trim() : '';

            if (!textarea || !message) {
                if (textarea) {
                    textarea.focus();
                }
                return;
            }

            try {
                textarea.value = '';

                const response = await fetch('/api/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Unable to send message.');
                }
            } catch (error) {
                textarea.value = message;
                textarea.placeholder = 'Failed to send. Please try again.';
                console.error(error);
            }
        }

        function renderPage(pageName) {
            if (pageName === 'profile') {
                rightPanel.innerHTML = `
                    <div class="panel-content-only profile-menu-panel">
                        <div class="top-row">
                            <button class="back-button" aria-label="Go back to main menu">←</button>
                        </div>
                        <div class="sub-menu">
                            <button class="menu-item" data-page="knowMe">GET TO KNOW ME</button>
                            <button class="menu-item" data-page="knownFacts">KNOWN FACTS</button>
                            <button class="menu-item" data-page="unknownFacts">UNKNOWN FACTS</button>
                            <button class="menu-item" data-page="whoIUlt">WHO I ULT</button>
                        </div>
                    </div>
                `;

                document.querySelector('.back-button').addEventListener('click', () => {
                    playArcadeBeep();
                    renderMainMenu();
                });
                document.querySelectorAll('.sub-menu .menu-item').forEach(button => {
                    button.addEventListener('click', () => {
                        playArcadeBeep();
                        renderDetail(button.dataset.page);
                    });
                });
                return;
            }

            const content = profileSections[pageName] || profileSections.knowMe;
            rightPanel.innerHTML = `
                <div class="panel-content-only">
                    <div class="top-row">
                        <button class="back-button" aria-label="Go back to main menu">←</button>
                    </div>
                    ${content}
                </div>
            `;

            const backButton = document.querySelector('.back-button');
            if (backButton) {
                backButton.addEventListener('click', () => {
                    playArcadeBeep();
                    renderMainMenu();
                });
            }

            if (pageName === 'message') {
                const submitButton = document.querySelector('.message-submit');
                if (submitButton) {
                    submitButton.addEventListener('click', sendMessageToCreator);
                }
            }

        }

        function renderDetail(pageName) {
            const content = profileSections[pageName] || profileSections.knowMe;
            rightPanel.innerHTML = `
                <div class="panel-content-only">
                    <div class="top-row">
                        <button class="back-button" aria-label="Go back to main menu">←</button>
                    </div>
                    ${content}
                </div>
            `;

            document.querySelector('.back-button').addEventListener('click', () => {
                playArcadeBeep();
                renderPage('profile');
            });
        }

        renderMainMenu();
    </script>
</body>
</html>
