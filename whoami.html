<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background-color: #000000;
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    letter-spacing: 1px;
}

.split-container {
    display: flex;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

.left-half,
.right-half {
    width: 50%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.left-half {
    background-color: #000000;
    padding: 0;
    overflow: hidden;
    align-items: stretch;
    justify-content: stretch;
}

.right-half {
    background-color: #000000;
    padding: 20px 24px;
    height: calc(100vh - 80px);
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    border: 3px solid #004cff;
    box-shadow: 0 0 10px #004cff, 0 0 20px #004cff, inset 0 0 10px rgba(0, 76, 255, 0.2);
    border-radius: 12px;
    margin: 40px 40px 40px 20px;
    background: rgba(0, 0, 0, 0.7);
    width: 85%;
    max-width: 650px; 
    min-width: 420px;
    min-height: 0;
    align-self: flex-start;
    overflow-y: hidden;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: #004cff #000000;
}

.menu-panel {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: flex-start;
    text-align: left;
    min-height: 100%;
    justify-content: center;
    position: relative;
}

.sub-menu {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 6px;
    padding-left: 2px;
    align-items: flex-start;
}

.menu-panel .menu-item,
.sub-menu .menu-item {
    align-self: flex-start;
    text-align: left;
    white-space: nowrap;
}

.menu-panel h1 {
    align-self: center;
    margin-left: 0;
    text-align: center;
}

.profile-menu-panel {
    position: relative;
}

.profile-menu-panel > .sub-menu {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    margin-top: 0;
    transform: translateY(-50%);
}

.panel-content-only {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.top-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.back-button {
    background: transparent;
    border: 2px solid #004cff;
    color: #004cff;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 0 8px #004cff;
}

.back-button:hover {
    background: rgba(0, 76, 255, 0.1);
}

.whoami-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: 42% center;
    min-height: 100vh;
}

h1 {
    margin: 0 0 18px 0;
    font-size: 40px;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 0 8px #ffffff;
}

h2 {
    margin: 0 0 16px;
    font-size: 30px;
    color: #004cff;
    text-transform: uppercase;
}

h3 {
    margin: 0 0 8px;
    font-size: 12px;
    color: #ffffff;
    text-transform: uppercase;
}

.menu-item {
    background: transparent;
    border: none;
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    text-align: left;
    padding: 0;
    cursor: pointer;
    font-size: 30px;
    text-transform: uppercase;
    transition: all 0.2s ease;
    position: relative;
    letter-spacing: 1px;
    outline: none;
    display: block;
    width: fit-content;
    line-height: 2;
}

.menu-item::before {
    content: '>';
    opacity: 0;
    color: #004cff;
    margin-right: 8px;
    transition: opacity 0.2s ease;
}

.menu-item:hover::before,
.menu-item.active::before,
.menu-item:focus::before {
    opacity: 1;
}

.menu-item:hover,
.menu-item.active,
.menu-item:focus {
    color: #004cff;
    transform: translateX(4px);
    text-shadow: 0 0 8px #004cff;
}

.sub-menu .menu-item {
    display: block;
    width: fit-content;
}

.panel-content {
    width: 100%;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.fact-box {
    border: 2px solid #004cff;
    background: rgba(0, 0, 0, 0.55);
    box-shadow: inset 0 0 8px rgba(0, 76, 255, 0.12);
    padding: 14px 12px;
    border-radius: 8px;
}

.know-me-box {
    position: relative;
    overflow: visible;
    padding-right: 110px;
}

.blue-cat-cap-image {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 130px;
    height: 130px;
    object-fit: contain;
    opacity: 0.95;
    filter: drop-shadow(0 0 8px rgba(0, 76, 255, 0.35));
    pointer-events: none;
}

.know-me-grid {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.know-me-grid p {
    margin: 0;
    line-height: 1.8;
}

.social-links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
}

.social-link {
    display: block;
    width: fit-content;
    color: #ffffff;
    text-decoration: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    line-height: 1.6;
    border: 2px solid #004cff;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 8px;
    padding: 8px 10px;
    transition: all 0.2s ease;
    box-shadow: 0 0 8px rgba(0, 76, 255, 0.25);
}

.social-link:hover,
.social-link:focus {
    color: #004cff;
    transform: translateX(4px);
    text-shadow: 0 0 8px #004cff;
    background: rgba(0, 76, 255, 0.08);
}

.fact-box p,
.fact-box li {
    color: #ffffff;
    font-size: 20px;
    line-height: 1.8;
    margin: 0;
    text-transform: none;
    letter-spacing: 0.5px;
}

.panel-content .fact-box p {
    font-size: 20px;
    line-height: 1.6;
}

.panel-content .fact-box li,
.panel-content .fact-box ul,
.panel-content .fact-box p {
    font-size: 20px;
}

.fact-box ul {
    margin: 0;
    padding-left: 18px;
}

.fact-box li + li {
    margin-top: 8px;
}

.known-facts-panel,
.unknown-facts-panel {
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.scrollable-facts-box {
    flex: 1 1 0;
    max-height: 100%;
    min-height: 0;
    overflow-y: scroll;
    overflow-x: hidden;
    scrollbar-width: auto;
    scrollbar-color: #7fb7ff #050b17;
    scrollbar-gutter: stable;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
}

.scrollable-facts-box::-webkit-scrollbar {
    width: 12px;
}

.scrollable-facts-box::-webkit-scrollbar-track {
    background: #050b17;
    border: 2px solid rgba(0, 76, 255, 0.35);
    border-radius: 999px;
}

.scrollable-facts-box::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #94c1ff, #004cff, #0031a6);
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 10px rgba(0, 76, 255, 0.9);
}

.socials-box {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: auto;
    scrollbar-color: #7fb7ff #050b17;
    scrollbar-gutter: stable;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
}

.socials-box::-webkit-scrollbar {
    width: 12px;
}

.socials-box::-webkit-scrollbar-track {
    background: #050b17;
    border: 2px solid rgba(0, 76, 255, 0.35);
    border-radius: 999px;
}

.socials-box::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #94c1ff, #004cff, #0031a6);
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 10px rgba(0, 76, 255, 0.9);
}

.lanyard-box {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 0;
    padding: 16px 28px;
}

.lanyard-music-list {
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    flex-direction: column;
    width: 100%;
    gap: 16px;
}

.lanyard-music-card {
    display: grid;
    flex: 1 1 100%;
    min-width: 0;
    max-width: none;
    grid-template-columns: 180px minmax(0, 1fr);
    grid-template-areas:
        "source source"
        "art info";
    align-items: center;
    gap: 12px 24px;
    text-align: left;
}

.lanyard-music-card.no-art {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas:
        "source"
        "info";
}

.lanyard-music-card + .lanyard-music-card {
    padding-top: 16px;
    border-top: 1px dashed rgba(0, 76, 255, 0.4);
}

.lanyard-source-label {
    grid-area: source;
    color: #9ab7ff;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
}

.now-playing-panel {
    text-align: center;
}

.lanyard-album-art {
    grid-area: art;
    width: 180px;
    height: 180px;
    flex: 0 0 180px;
    border: 2px solid #004cff;
    border-radius: 8px;
    object-fit: cover;
    box-shadow: 0 0 10px rgba(0, 76, 255, 0.35);
}

.lanyard-track-info {
    grid-area: info;
    display: flex;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    text-align: left;
}

.panel-content .lanyard-track-info .lanyard-track-details,
.lanyard-track-details {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin: 0;
    width: 100%;
    max-width: 100%;
    gap: 3px;
    text-align: left;
}

.lanyard-track-artists {
    display: block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #ffffff;
    font-size: 15px;
    line-height: 1.4;
}

.lanyard-track-album-line {
    display: block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #9ab7ff;
    font-size: 13px;
    line-height: 1.4;
}

.lanyard-track-link {
    display: block;
    max-width: 100%;
    margin: 0;
    overflow: hidden;
    color: #9ab7ff;
    font-size: 18px;
    line-height: 1.5;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
}

.lanyard-track-link:hover,
.lanyard-track-link:focus {
    color: #ffffff;
}

.lanyard-album-art[hidden],
.lanyard-music-list[hidden],
.lanyard-track-artists[hidden],
.lanyard-track-album-line[hidden],
.lanyard-track-link[hidden],
.lanyard-activity[hidden],
.lanyard-track-timing[hidden] {
    display: none;
}

.lanyard-track-timing {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 10px;
    color: #ffffff;
    font-size: 14px;
}

.lanyard-activity {
    width: 100%;
    color: #9ab7ff;
    text-align: center;
}

.lanyard-empty-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    width: 100%;
    padding: 10px 0;
}

.lanyard-activity-title {
    color: #ffffff;
    font-size: 18px;
    margin: 0;
    line-height: 1.5;
}

.lanyard-hint {
    color: #9ab7ff;
    font-size: 13px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.6;
}

.lanyard-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #ffffff;
    background: rgba(0, 76, 255, 0.2);
    border: 1px solid #004cff;
    padding: 4px 12px;
    border-radius: 999px;
    margin-top: 4px;
}

.lanyard-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #747f8d;
}

.lanyard-status-dot.online {
    background: #3ba55d;
    box-shadow: 0 0 6px #3ba55d;
}

.lanyard-status-dot.dnd {
    background: #ed4245;
    box-shadow: 0 0 6px #ed4245;
}

.lanyard-status-dot.idle {
    background: #faa81a;
    box-shadow: 0 0 6px #faa81a;
}

.lanyard-refresh-button {
    font-family: inherit;
    font-size: 12px;
    color: #004cff;
    background: #ffffff;
    border: 2px solid #004cff;
    border-radius: 4px;
    padding: 6px 16px;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
}

.lanyard-refresh-button:hover,
.lanyard-refresh-button:focus {
    background: #004cff;
    color: #ffffff;
    box-shadow: 0 0 8px rgba(0, 76, 255, 0.6);
}

.lanyard-track-info[hidden] {
    display: none;
}

.lanyard-track-progress {
    flex: 1;
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: #565960;
}

.lanyard-track-progress-fill {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: #ffffff;
    transition: width 0.3s linear;
}

.message-box {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.message-label {
    color: #ffffff;
    font-size: 12px;
    line-height: 1.7;
    letter-spacing: 1px;
}

.message-textarea {
    width: 100%;
    min-height: 170px;
    resize: vertical;
    border: 2px solid #004cff;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.55);
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    line-height: 1.8;
    padding: 14px 12px;
    box-shadow: inset 0 0 8px rgba(0, 76, 255, 0.15);
}

.message-textarea::placeholder {
    color: rgba(255, 255, 255, 0.55);
}

.message-textarea:focus {
    outline: none;
    border-color: #7aa8ff;
    box-shadow: 0 0 0 2px rgba(0, 76, 255, 0.2), inset 0 0 8px rgba(0, 76, 255, 0.2);
}

.message-submit {
    align-self: flex-start;
    border: 2px solid #004cff;
    background: rgba(0, 76, 255, 0.08);
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(0, 76, 255, 0.3);
    transition: all 0.2s ease;
}

.message-submit:hover,
.message-submit:focus {
    color: #004cff;
    transform: translateX(4px);
    text-shadow: 0 0 8px #004cff;
}

        function playArcadeBeep() {
            arcadeAudioContext ||= new AudioContext();
            const oscillator = arcadeAudioContext.createOscillator();
            const gain = arcadeAudioContext.createGain();
            const startTime = arcadeAudioContext.currentTime;

            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(620, startTime);
            oscillator.frequency.exponentialRampToValueAtTime(330, startTime + 0.08);
            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(0.12, startTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.09);
            oscillator.connect(gain);
            gain.connect(arcadeAudioContext.destination);
            oscillator.start(startTime);
            oscillator.stop(startTime + 0.1);
        }

        function disconnectLanyardSocket() {
            if (lanyardHeartbeatTimer) {
                clearInterval(lanyardHeartbeatTimer);
                lanyardHeartbeatTimer = null;
            }
            if (lanyardSocket) {
                try {
                    lanyardSocket.onclose = null;

                    lanyardSocket.close();
                } catch {}
                lanyardSocket = null;

        function connectLanyardSocket() {
            if (typeof WebSocket === 'undefined') return;
            if (lanyardSocket && (lanyardSocket.readyState === WebSocket.OPEN || lanyardSocket.readyState === WebSocket.CONNECTING)) {
                return;
            }

            try {
                lanyardSocket = new WebSocket('wss://api.lanyard.rest/socket');

                lanyardSocket.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        const { op, t, d } = message;

                        if (op === 1) { // Hello
                            const heartbeatInterval = d.heartbeat_interval || 30000;
                            if (lanyardSocket && lanyardSocket.readyState === WebSocket.OPEN) {
                                lanyardSocket.send(JSON.stringify({
                                    op: 2,
                                    d: {
                                        subscribe_to_id: DISCORD_USER_ID
                                    }
                                }));
                            }

                            if (lanyardHeartbeatTimer) clearInterval(lanyardHeartbeatTimer);
                            lanyardHeartbeatTimer = setInterval(() => {
                                if (lanyardSocket && lanyardSocket.readyState === WebSocket.OPEN) {
                                    lanyardSocket.send(JSON.stringify({ op: 3 }));
                                }
                            }, heartbeatInterval);
                        } else if (op === 0) { // Event
                            if (t === 'INIT_STATE' || t === 'PRESENCE_UPDATE') {
                                latestLanyardPresence = d;
                                renderUnifiedMusic();
                            }
                        }
                    } catch (err) {
                        console.warn('Lanyard socket message parse warning:', err);
                    }
                };

                lanyardSocket.onopen = () => {
                    console.log('Lanyard WebSocket connected.');
                };

                lanyardSocket.onerror = (err) => {
                    console.warn('Lanyard WebSocket notice:', err);
                };

                lanyardSocket.onclose = () => {
                    if (lanyardHeartbeatTimer) {
                        clearInterval(lanyardHeartbeatTimer);
                        lanyardHeartbeatTimer = null;
                    }
                    lanyardSocket = null;
                };
            } catch (err) {
                console.warn('Unable to initialize Lanyard WebSocket:', err);
            }
        }

        function formatTrackTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateTrackProgress() {
            document.querySelectorAll('.lanyard-track-timing[data-start][data-end]').forEach(timing => {
                const startedAt = Number(timing.dataset.start);
                const endsAt = Number(timing.dataset.end);
                const durationSeconds = Math.floor((endsAt - startedAt) / 1000);
                const elapsedSeconds = Math.min(durationSeconds, Math.max(0, Math.floor((Date.now() - startedAt) / 1000)));
                const progressPercent = durationSeconds > 0 ? (elapsedSeconds / durationSeconds) * 100 : 0;
                const elapsedTime = timing.querySelector('[data-elapsed-time]');
                const totalTime = timing.querySelector('[data-total-time]');
                const progress = timing.querySelector('[role="progressbar"]');
                const progressFill = timing.querySelector('.lanyard-track-progress-fill');

                if (!elapsedTime || !totalTime || !progress || !progressFill || durationSeconds <= 0) return;

                elapsedTime.textContent = formatTrackTime(elapsedSeconds);
                totalTime.textContent = formatTrackTime(durationSeconds);
                progress.setAttribute('aria-valuenow', String(Math.round(progressPercent)));
                progressFill.style.width = `${progressPercent}%`;
                timing.hidden = false;
            });
        }

        const DISCORD_USER_ID = '772073053097033741';
        const albumCache = new Map();

        async function fetchAlbumForTrack(artist, title) {
            const cleanArtist = (artist || '').trim();
            const cleanTitle = (title || '').trim();
            if (!cleanArtist || !cleanTitle) return null;
            const key = `${cleanArtist.toLowerCase()} - ${cleanTitle.toLowerCase()}`;
            if (albumCache.has(key)) return albumCache.get(key);

            try {
                const query = encodeURIComponent(`${cleanArtist} ${cleanTitle}`);
                const response = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                if (!response.ok) return null;
                const result = await response.json();
                const albumName = result.results?.[0]?.collectionName || null;
                albumCache.set(key, albumName);
                return albumName;
            } catch {
                return null;
            }
        }

        function resolveDiscordAssetUrl(applicationId, assetId) {
            if (!assetId || typeof assetId !== 'string') {
                return { url: null, fallback: null };
            }
            if (assetId.startsWith('spotify:')) {
                return { url: `https://i.scdn.co/image/${assetId.slice('spotify:'.length)}`, fallback: null };
            }
            if (assetId.startsWith('youtube:')) {
                return { url: `https://i.ytimg.com/vi/${assetId.slice('youtube:'.length)}/hqdefault.jpg`, fallback: null };
            }
            if (assetId.startsWith('mp:external/')) {
                const proxyUrl = `https://media.discordapp.net/external/${assetId.slice('mp:external/'.length)}`;
                let directUrl = null;
                const match = assetId.match(/^mp:external\/[^/]+\/(https?)\/(.+)$/);
                if (match) {
                    try {
                        directUrl = `${match[1]}://${decodeURIComponent(match[2])}`;
                    } catch {
                        directUrl = `${match[1]}://${match[2]}`;
                    }
                }
                return { url: proxyUrl, fallback: directUrl };
            }
            if (assetId.startsWith('http://') || assetId.startsWith('https://')) {
                return { url: assetId, fallback: null };
            }
            if (applicationId) {
                return {
                    url: `https://cdn.discordapp.com/app-assets/${applicationId}/${assetId}.png`,
                    fallback: `https://cdn.discordapp.com/app-assets/${applicationId}/${assetId}.webp`
                };
            }
            return { url: null, fallback: null };
        }

        function parseMusicActivity(activity) {
            if (!activity) return null;

            const name = (activity.name || '').trim();
            const nameLower = name.toLowerCase();
            const details = (activity.details || '').trim();
            const state = (activity.state || '').trim();
            const detailsUrl = (activity.details_url || '').trim();
            const appId = String(activity.application_id || '');
            const actType = activity.type;
            const statusDisplay = activity.status_display_type;

            const buttons = Array.isArray(activity.buttons) ? activity.buttons : [];
            const buttonTexts = [];
            const buttonUrls = [];
            for (const b of buttons) {
                if (typeof b === 'string') {
                    buttonTexts.push(b.toLowerCase());
                } else if (b && typeof b === 'object') {
                    if (b.label) buttonTexts.push(String(b.label).toLowerCase());
                    if (b.url) buttonUrls.push(String(b.url).toLowerCase());
                }
            }

            const largeImage = String(activity.assets?.large_image || '');
            const largeText = (activity.assets?.large_text || '').trim();
            const smallText = (activity.assets?.small_text || '').trim();

            const isBitChord = appId === '1543679166967193620' ||
                               nameLower.includes('bitchord') ||
                               buttonTexts.some(t => t.includes('bitchord')) ||
                               detailsUrl.toLowerCase().includes('bitchord');

            const isYouTubeMusic = nameLower.includes('youtube music') ||
                                   nameLower.includes('yt music') ||
                                   detailsUrl.toLowerCase().includes('music.youtube.com') ||
                                   buttonUrls.some(u => u.includes('music.youtube.com')) ||
                                   buttonTexts.some(t => t.includes('youtube music'));

            const isSpotify = nameLower.includes('spotify') ||
                              String(activity.id || '').startsWith('spotify:') ||
                              largeImage.startsWith('spotify:') ||
                              detailsUrl.toLowerCase().includes('open.spotify.com');

            const isListeningType = actType === 2 || statusDisplay === 2;
            const isOtherMusic = /apple music|soundcloud|tidal|deezer|musicbee|foobar2000|cider|aimp|winamp|vlc/i.test(name);

            if (!isBitChord && !isYouTubeMusic && !isSpotify && !isListeningType && !isOtherMusic) {
                return null;
            }

            let source = 'Music';
            if (isBitChord) {
                source = 'BitChord';
            } else if (isYouTubeMusic) {
                source = 'YouTube Music';
            } else if (isSpotify) {
                source = 'Spotify';
            } else if (name) {
                source = name;
            }

            let title = details || state || name;
            title = title.replace(/^listening to\s+/i, '').trim();

            let artist = '';
            if (details && state && details !== state) {
                artist = state.replace(/^by\s+/i, '').trim();
            }

            let album = '';
            const candidateAlbum = largeText || smallText;
            if (candidateAlbum &&
                candidateAlbum.toLowerCase() !== nameLower &&
                !/^(youtube music|bitchord|spotify)$/i.test(candidateAlbum) &&
                candidateAlbum !== title &&
                candidateAlbum !== artist) {
                album = candidateAlbum;
            }

            const { url: artworkUrl, fallback: fallbackArtworkUrl } = resolveDiscordAssetUrl(
                activity.application_id,
                activity.assets?.large_image
            );

            let url = detailsUrl || '';
            if (!url && buttonUrls.length > 0) {
                url = buttonUrls[0];
            }
            if (!url) {
                const searchQuery = encodeURIComponent(`${title} ${artist}`.trim());
                if (isYouTubeMusic || isBitChord) {
                    url = `https://music.youtube.com/search?q=${searchQuery}`;
                } else if (isSpotify) {
                    url = `https://open.spotify.com/search/${searchQuery}`;
                } else if (title) {
                    url = `https://www.google.com/search?q=${encodeURIComponent(`${source} ${title} ${artist}`.trim())}`;
                }
            }

            return {
                source,
                title,
                artist,
                album,
                artworkUrl,
                fallbackArtworkUrl,
                url,
                timestamps: activity.timestamps || null
            };
        }

        function createMusicCard(track) {
            const card = document.createElement('article');
            card.className = 'lanyard-music-card';
            if (!track.artworkUrl) {
                card.classList.add('no-art');
            }

            const sourceLabel = document.createElement('span');
            sourceLabel.className = 'lanyard-source-label';

                albumArt.className = 'lanyard-album-art';
                albumArt.alt = `${track.source} album art`;
                albumArt.src = track.artworkUrl;
                albumArt.onerror = () => {

            const trackInfo = document.createElement('div');

                trackTitle.rel = 'noopener noreferrer';
            }
            trackInfo.appendChild(trackTitle);

            if (track.artist || track.album) {
                const trackDetails = document.createElement('div');
                trackDetails.className = 'lanyard-track-details';

                    const artist = document.createElement('span');

                            album.textContent = albumName;
                            trackDetails.appendChild(album);
                        }
                    });
                }
                trackInfo.appendChild(trackDetails);
            }

            const timestamps = track.timestamps || {};
            const startedAt = Number(timestamps.start);
            const endsAt = Number(timestamps.end);
            const hasTiming = Number.isFinite(startedAt) && Number.isFinite(endsAt) && startedAt > 0 && endsAt > startedAt;
            if (hasTiming) {
                const timing = document.createElement('div');
                timing.className = 'lanyard-track-timing';
                timing.dataset.start = String(startedAt);
                timing.dataset.end = String(endsAt);

                const elapsedTime = document.createElement('span');
                elapsedTime.dataset.elapsedTime = '';
                elapsedTime.textContent = '00:00';

                const progress = document.createElement('div');
                progress.className = 'lanyard-track-progress';
                progress.setAttribute('role', 'progressbar');
                progress.setAttribute('aria-label', `${track.source} track progress`);
                progress.setAttribute('aria-valuemin', '0');
                progress.setAttribute('aria-valuemax', '100');
                progress.setAttribute('aria-valuenow', '0');

                const progressFill = document.createElement('span');
                progressFill.className = 'lanyard-track-progress-fill';
                progress.appendChild(progressFill);

                const totalTime = document.createElement('span');
                totalTime.dataset.totalTime = '';
                totalTime.textContent = '00:00';

                timing.append(elapsedTime, progress, totalTime);
                trackInfo.appendChild(timing);
            }

            card.appendChild(trackInfo);
            return { element: card, hasTiming };
        }

                            ? `https://open.spotify.com/track/${encodeURIComponent(spotify.track_id)}`
                            : 'https://open.spotify.com/',
                        timestamps: spotify.timestamps
                    });
                }
            }

            // 3. Discord Rich Presence activities (BitChord, YouTube Music, etc.)
            if (latestLanyardPresence && Array.isArray(latestLanyardPresence.activities)) {
                for (const activity of latestLanyardPresence.activities) {
                    const parsed = parseMusicActivity(activity);
                    if (!parsed) continue;

                    if (parsed.source.toLowerCase() === 'spotify' && tracks.some(t => t.source.toLowerCase() === 'spotify')) {
                        continue;
                    }

                    const isDuplicate = tracks.some(t =>
                        t.source.toLowerCase() === parsed.source.toLowerCase() &&
                        t.title.toLowerCase() === parsed.title.toLowerCase()
                    );
                    if (!isDuplicate) {
                        tracks.push(parsed);
                    }
                }
            }

            if (tracks.length > 0) {
                const cards = tracks.map(createMusicCard);
                musicList.replaceChildren(...cards.map(card => card.element));
                musicList.hidden = false;
                if (cards.some(card => card.hasTiming)) {
                    updateTrackProgress();
                    trackProgressTimer = setInterval(updateTrackProgress, 1000);
                }
            } else {
                renderNoMusic(musicList, latestLanyardPresence);
            }
        }

        async function fetchLanyardPresence() {
            const musicList = document.getElementById('lanyard-music-list');
            if (!musicList) return;

            if (isLoadingLanyard) return;
            isLoadingLanyard = true;

            try {
                const fetchWithTimeout = async (url, timeoutMs) => {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), timeoutMs);
                    try {
                        const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
                        clearTimeout(timer);
                        return res.ok ? await res.json() : null;
                    } catch {
                        clearTimeout(timer);
                        return null;
                    }
                };

                const [lanyardData, directData] = await Promise.all([
                    fetchWithTimeout(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`, 6000),
                    fetchWithTimeout('/api/now-playing', 6000)
                ]);

                if (lanyardData && lanyardData.success && lanyardData.data) {
                    latestLanyardPresence = lanyardData.data;
                }
                if (directData) {
                    latestDirectTrack = directData.isPlaying ? directData : null;
                }

                renderUnifiedMusic();
            } catch (error) {
                stopTrackProgress();
                if (!musicList.children.length || musicList.querySelector('.lanyard-empty-card') || musicList.querySelector('.lanyard-activity')) {
                    renderNoMusic(musicList, latestLanyardPresence, 'Unable to connect to music services.');
                }
                console.warn('Music presence fetch notice:', error);
            } finally {
                isLoadingLanyard = false;
            }
        }

        async function sendMessageToCreator() {
            const textarea = document.getElementById('message-input');
            const message = textarea ? textarea.value.trim() : '';

            if (!textarea || !message) {
                if (textarea) {
                    textarea.focus();
                }
                return;
            }

            try {
                textarea.value = '';

                const response = await fetch('/api/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Unable to send message.');
                }
            } catch (error) {
                textarea.value = message;
                textarea.placeholder = 'Failed to send. Please try again.';
                console.error(error);
            }
        }

        function renderPage(pageName, updateHistory = true) {
            stopLanyardRefresh();
            if (updateHistory) {
                history.pushState({ screen: 'page', page: pageName }, '', `#${pageName}`);
            }

            if (pageName === 'profile') {
                rightPanel.innerHTML = `
                    <div class="panel-content-only profile-menu-panel">
                        <div class="top-row">
                            <button class="back-button" aria-label="Go back to main menu">←</button>
                        </div>
                        <div class="sub-menu">
                            <button class="menu-item" data-page="knowMe">GET TO KNOW ME</button>
                            <button class="menu-item" data-page="knownFacts">KNOWN FACTS</button>
                            <button class="menu-item" data-page="unknownFacts">UNKNOWN FACTS</button>
                            <button class="menu-item" data-page="whoIUlt">WHO I ULT</button>
                        </div>
                    </div>
                `;

                const backBtn = document.querySelector('.back-button');
                if (backBtn) {
                    backBtn.addEventListener('click', () => {
                        playArcadeBeep();
                        if (window.history.length > 1) {
                            history.back();
                        } else {
                            renderMainMenu(true);
                        }
                    });
                }

                document.querySelectorAll('.sub-menu .menu-item').forEach(button => {
                    button.addEventListener('click', () => {
                        playArcadeBeep();
                        renderDetail(button.dataset.page, true);
                    });
                });
                return;
            }

            const content = profileSections[pageName] || profileSections.knowMe;
            rightPanel.innerHTML = `
                <div class="panel-content-only">
                    <div class="top-row">
                        <button class="back-button" aria-label="Go back to main menu">←</button>
                    </div>
                    ${content}
                </div>
            `;

            const backButton = document.querySelector('.back-button');
            if (backButton) {
                backButton.addEventListener('click', () => {
                    playArcadeBeep();
                    if (window.history.length > 1) {
                        history.back();
                    } else {
                        renderMainMenu(true);
                    }
                });
            }

            if (pageName === 'message') {
                const submitButton = document.querySelector('.message-submit');
                if (submitButton) {
                    submitButton.addEventListener('click', sendMessageToCreator);
                }
            }

            if (pageName === 'nowPlaying') {
                startLanyardMonitoring();
            }

        }

        function renderDetail(pageName, updateHistory = true) {
            stopLanyardRefresh();
            if (updateHistory) {
                history.pushState({ screen: 'detail', detail: pageName }, '', `#${pageName}`);
            }

            const content = profileSections[pageName] || profileSections.knowMe;
            rightPanel.innerHTML = `
                <div class="panel-content-only">
                    <div class="top-row">
                        <button class="back-button" aria-label="Go back to main menu">←</button>
                    </div>
                    ${content}
                </div>
            `;

            const backButton = document.querySelector('.back-button');
            if (backButton) {
                backButton.addEventListener('click', () => {
                    playArcadeBeep();
                    if (window.history.length > 1) {
                        history.back();
                    } else {
                        renderPage('profile', true);
                    }
                });
            }
        }

        const DETAIL_PAGES = ['knowMe', 'knownFacts', 'unknownFacts', 'whoIUlt'];
        const TOP_PAGES = ['profile', 'socials', 'nowPlaying', 'sidequests', 'message'];

        function restoreNavigation() {
            const hash = (window.location.hash || '').replace(/^#/, '').trim();
            if (DETAIL_PAGES.includes(hash)) {
                history.replaceState({ screen: 'detail', detail: hash }, '', `#${hash}`);
                renderDetail(hash, false);
            } else if (TOP_PAGES.includes(hash)) {
                history.replaceState({ screen: 'page', page: hash }, '', `#${hash}`);
                renderPage(hash, false);
            } else {
                history.replaceState({ screen: 'menu' }, '', '#menu');
                renderMainMenu(false);
            }
        }

        window.addEventListener('popstate', (event) => {
            playArcadeBeep();
            const state = event.state;
            const hash = (window.location.hash || '').replace(/^#/, '').trim();

            if (state && state.screen === 'detail') {
                renderDetail(state.detail, false);
            } else if (state && state.screen === 'page') {
                renderPage(state.page, false);
            } else if (state && state.screen === 'menu') {
                renderMainMenu(false);
            } else if (DETAIL_PAGES.includes(hash)) {
                renderDetail(hash, false);
            } else if (TOP_PAGES.includes(hash)) {
                renderPage(hash, false);
            } else {
                renderMainMenu(false);
            }
        });

        restoreNavigation();
    </script>
</body>
</html>
