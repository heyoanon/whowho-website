        function getStoredAdminToken() {
            try {
                return sessionStorage.getItem('whowho_admin_token') || localStorage.getItem('whowho_admin_token') || '';
            } catch {
                return '';
            }
        }

        function setStoredAdminToken(token) {
            try {
                if (token) {
                    sessionStorage.setItem('whowho_admin_token', token);
                    localStorage.setItem('whowho_admin_token', token);
                    isAdminLoggedIn = true;
                } else {
                    sessionStorage.removeItem('whowho_admin_token');
                    localStorage.removeItem('whowho_admin_token');
                    isAdminLoggedIn = false;
                }
            } catch {
                isAdminLoggedIn = Boolean(token);
            }
        }

        async function checkAdminStatus() {
            const token = getStoredAdminToken();
            if (!token) {
                isAdminLoggedIn = false;
                return false;
            }
            try {
                const res = await fetch('/api/admin/status', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    isAdminLoggedIn = Boolean(data && data.isAdmin);
                    if (!isAdminLoggedIn) setStoredAdminToken(null);
                } else {
                    isAdminLoggedIn = false;
                    setStoredAdminToken(null);
                }
            } catch {
                isAdminLoggedIn = Boolean(token);
            }
            return isAdminLoggedIn;
        }

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) close();

            const pwdInput = overlay.querySelector('#admin-password-input');
            pwdInput.focus();

            window.submitAdminPassword = async () => {
                playArcadeBeep();
                const pwd = pwdInput.value.trim();
                const errorEl = overlay.querySelector('#admin-auth-error');
                const submitBtn = overlay.querySelector('#btn-admin-login');

                if (!pwd) {
                    pwdInput.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'CHECKING...';
                if (errorEl) errorEl.style.display = 'none';

                try {
                    const res = await fetch('/api/admin/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pwd })
                    });

                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        throw new Error(errData.error || 'Invalid admin password.');
                    }

                    const data = await res.json();
                    setStoredAdminToken(data.token);
                    showToast('ADMIN UNLOCKED! WELCOME.');
                    overlay.remove();
                    document.removeEventListener('keydown', handleKey);

                    if (typeof onAuthenticated === 'function') {
                        onAuthenticated();
                    }
                } catch (err) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'UNLOCK';
                    if (errorEl) {
                        errorEl.textContent = err.message || 'Invalid admin password.';
                        errorEl.style.display = 'block';
                    }
                    pwdInput.focus();
                    pwdInput.select();
                }
            };
        }

        function normalizeQuests(quests) {
            if (!Array.isArray(quests)) return [];
            return quests.map((q, idx) => {
                if (typeof q === 'string') {
                    return { id: `sq-${idx}`, text: q, done: false };
                }
                return {
                    id: (q && q.id) ? q.id : `sq-${idx}`,
                    text: (q && typeof q.text === 'string') ? q.text : String(q ? q.text || '' : ''),
                    done: Boolean(q && q.done)
                };
            });
        }

        function normalizeLoopTracks(tracks) {
            if (!Array.isArray(tracks)) return [];
            return tracks.filter(t => t && (t.title || t.artist)).map((t, idx) => ({
                id: (t && t.id) ? t.id : `loop-${Date.now()}-${idx}-${Math.random().toString(36).substr(2, 4)}`,
                title: String(t.title || '').trim(),
                artist: String(t.artist || '').trim(),
                album: String(t.album || '').trim(),
                source: String(t.source || 'Spotify').trim() || 'Spotify',
                url: String(t.url || '').trim(),
                artworkUrl: String(t.artworkUrl || '').trim()
            }));
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return String(str || '');
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function loadProfileData() {
            try {
                const local = localStorage.getItem('whowho_profile_data');
                if (local) {
                    const parsed = JSON.parse(local);
                    if (parsed && typeof parsed === 'object') {
                        currentProfileData = Object.assign({}, defaultProfileData, parsed);
                        currentProfileData.knowMe = Object.assign({}, defaultProfileData.knowMe, parsed.knowMe || {});
                        currentProfileData.ultBias = Object.assign({}, defaultProfileData.ultBias, parsed.ultBias || {});
                        currentProfileData.ultGroups = Object.assign({}, defaultProfileData.ultGroups, parsed.ultGroups || {});
                        if (Array.isArray(parsed.knownFacts)) currentProfileData.knownFacts = parsed.knownFacts;
                        if (Array.isArray(parsed.unknownFacts)) currentProfileData.unknownFacts = parsed.unknownFacts;
                        if (Array.isArray(parsed.hobbies)) currentProfileData.hobbies = parsed.hobbies;
                        if (!Array.isArray(currentProfileData.hobbies) || currentProfileData.hobbies.length === 0) currentProfileData.hobbies = [...defaultProfileData.hobbies];
                        if (Array.isArray(parsed.sidequests)) currentProfileData.sidequests = normalizeQuests(parsed.sidequests);
                        if (Array.isArray(parsed.inTheLoop) && parsed.inTheLoop.length > 0) {
                            currentProfileData.inTheLoop = normalizeLoopTracks(parsed.inTheLoop);
                        } else if (parsed.onRepeat && parsed.onRepeat.title) {
                            currentProfileData.inTheLoop = normalizeLoopTracks([parsed.onRepeat]);
                        } else {
                            currentProfileData.inTheLoop = normalizeLoopTracks(defaultProfileData.inTheLoop);
                        }
                        if (currentProfileData.inTheLoop.length > 0) {
                            currentProfileData.onRepeat = currentProfileData.inTheLoop[0];
                        }
                    }
                }
            } catch {}

            try {
                const res = await fetch('/api/profile', { cache: 'no-store' });
                if (res.ok) {
                    const json = await res.json();
                    if (json && json.success && json.profile && typeof json.profile === 'object') {
                        const s = json.profile;
                        currentProfileData = Object.assign({}, defaultProfileData, s);
                        currentProfileData.knowMe = Object.assign({}, defaultProfileData.knowMe, s.knowMe || {});
                        currentProfileData.ultBias = Object.assign({}, defaultProfileData.ultBias, s.ultBias || {});
                        currentProfileData.ultGroups = Object.assign({}, defaultProfileData.ultGroups, s.ultGroups || {});
                        if (Array.isArray(s.knownFacts)) currentProfileData.knownFacts = s.knownFacts;
                        if (Array.isArray(s.unknownFacts)) currentProfileData.unknownFacts = s.unknownFacts;
                        if (Array.isArray(s.hobbies)) currentProfileData.hobbies = s.hobbies;
                        if (!Array.isArray(currentProfileData.hobbies) || currentProfileData.hobbies.length === 0) currentProfileData.hobbies = [...defaultProfileData.hobbies];
                        if (Array.isArray(s.sidequests)) currentProfileData.sidequests = normalizeQuests(s.sidequests);
                        if (Array.isArray(s.inTheLoop) && s.inTheLoop.length > 0) {
                            currentProfileData.inTheLoop = normalizeLoopTracks(s.inTheLoop);
                        } else if (s.onRepeat && s.onRepeat.title) {
                            currentProfileData.inTheLoop = normalizeLoopTracks([s.onRepeat]);
                        } else if (!Array.isArray(currentProfileData.inTheLoop) || currentProfileData.inTheLoop.length === 0) {
                            currentProfileData.inTheLoop = normalizeLoopTracks(defaultProfileData.inTheLoop);
                        }
                        if (currentProfileData.inTheLoop.length > 0) {
                            currentProfileData.onRepeat = currentProfileData.inTheLoop[0];
                        }
                        try {
                            localStorage.setItem('whowho_profile_data', JSON.stringify(currentProfileData));
                        } catch {}

                        const hash = (window.location.hash || '').replace(/^#/, '').trim();
                        if (DETAIL_PAGES.includes(hash) && !editingSection) {
                            renderDetail(hash, false);
                        } else if (hash === 'sidequests' && !isEditingSideQuests) {
                            renderPage('sidequests', false);
                        }
                    }
                }
            } catch (err) {
                console.warn('Profile sync notice:', err);
            }
        }

        async function saveProfileToServer(data) {
            const token = getStoredAdminToken();
            try {
                const res = await fetch('/api/profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : ''
                    },
                    body: JSON.stringify(data)
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        showToast('ADMIN AUTH REQUIRED TO SAVE.');
                        showAdminPasswordModal('Admin authentication expired or required. Enter password to save:', () => {
                            saveProfileToServer(data);
                        });
                    }
                }
            } catch (err) {
                console.warn('Profile save warning:', err);
            }
        }

                        currentProfileData.knowMe = {

                        };

                        const text = (formData.get('facts') || '').trim();

                    } else if (sectionKey === 'unknownFacts') {
                        const text = (formData.get('facts') || '').trim();
                        currentProfileData.unknownFacts = text.split('\n').map(l => l.trim()).filter(Boolean);
                    } else if (sectionKey === 'hobbies') {
                        const text = (formData.get('facts') || formData.get('hobbies') || '').trim();
                        currentProfileData.hobbies = text.split('\n').map(l => l.trim()).filter(Boolean);
                    } else if (sectionKey === 'ultBias') {
                        currentProfileData.ultBias = {
                            kpop: (formData.get('kpop') || '').trim(),
                            thaiGl: (formData.get('thaiGl') || '').trim(),
                            ppop: (formData.get('ppop') || '').trim(),
                            other: (formData.get('other') || '').trim()
                        };
                    } else if (sectionKey === 'ultGroups') {
                        currentProfileData.ultGroups = {
                            mainUlt: (formData.get('mainUlt') || '').trim(),
                            stanGroups: (formData.get('stanGroups') || '').trim(),
                            boyGroups: (formData.get('boyGroups') || '').trim()
                        };
                    } else if (sectionKey === 'nowPlaying') {
                        currentProfileData.onRepeat = {
                            title: (formData.get('title') || '').trim(),
                            artist: (formData.get('artist') || '').trim(),
                            album: (formData.get('album') || '').trim(),
                            url: (formData.get('url') || '').trim(),
                            artworkUrl: (formData.get('artworkUrl') || '').trim(),
                            source: (formData.get('source') || 'Spotify').trim() || 'Spotify'

                        renderDetail(sectionKey, false);

        function getLoopServiceClass(source) {
            const s = String(source || '').toLowerCase();
            if (s.includes('spotify')) return 'spotify';
            if (s.includes('youtube') || s.includes('ytm')) return 'ytm';
            if (s.includes('apple')) return 'apple';
            if (s.includes('bitchord')) return 'bitchord';
            return '';
        }

                isAddTrackFormOpen = forceState;

            }

            if (card) {
                card.style.display = isAddTrackFormOpen ? 'block' : 'none';

        function autofillLoopFromCurrentSong() {
            playArcadeBeep();
            if (!isAddTrackFormOpen) {
                toggleAddTrackForm(true);
            }
            const track = latestDirectTrack || (latestLanyardPresence && latestLanyardPresence.spotify ? {
                title: latestLanyardPresence.spotify.song,
                artist: latestLanyardPresence.spotify.artist,
                album: latestLanyardPresence.spotify.album,
                artworkUrl: latestLanyardPresence.spotify.album_art_url,
                url: latestLanyardPresence.spotify.track_id ? `https://open.spotify.com/track/${latestLanyardPresence.spotify.track_id}` : '',
                source: 'Spotify'
            } : null);

            if (!track || !track.title) {
                showToast('NO ACTIVE TRACK DETECTED ON DEVICE.');
                return;
            }

            const titleEl = document.getElementById('loop-new-title');
            const artistEl = document.getElementById('loop-new-artist');
            const albumEl = document.getElementById('loop-new-album');
            const sourceEl = document.getElementById('loop-new-source');
            const urlEl = document.getElementById('loop-new-url');
            const artworkEl = document.getElementById('loop-new-artwork');

            if (titleEl) titleEl.value = track.title || '';
            if (artistEl) artistEl.value = track.artist || '';
            if (albumEl) albumEl.value = track.album || '';
            if (sourceEl) sourceEl.value = track.source || 'Spotify';
            if (urlEl) urlEl.value = track.url || '';
            if (artworkEl) artworkEl.value = track.artworkUrl || '';

            if (track.title && track.artist && (!track.artworkUrl || !track.album)) {
                fetchArtworkAndAlbumForTrack(track.artist, track.title, track.album).then(res => {
                    if (res) {
                        if (albumEl && !albumEl.value && res.album) albumEl.value = res.album;
                        if (artworkEl && !artworkEl.value && res.artworkUrl) artworkEl.value = res.artworkUrl;
                    }
                });
            }

            showToast(`⚡ AUTO-FILLED: "${(track.title || '').toUpperCase()}"!`);
        }
        window.autofillLoopFromCurrentSong = autofillLoopFromCurrentSong;

        async function saveLoopToServer(tracks) {
            try {
                await fetch('/api/loop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inTheLoop: tracks })
                });
            } catch (err) {
                console.warn('Loop save notice:', err);
            }
        }
        window.saveLoopToServer = saveLoopToServer;

        function addTrackObjectToLoop(track) {
            playArcadeBeep();
            if (!track || !track.title) {
                showToast('NO ACTIVE TRACK TO ADD.');
                return;
            }

            if (!Array.isArray(currentProfileData.inTheLoop)) {
                currentProfileData.inTheLoop = [];
            }

            const title = String(track.title || '').trim();
            const artist = String(track.artist || '').trim();

            const existingIndex = currentProfileData.inTheLoop.findIndex(t => 
                (t.title || '').trim().toLowerCase() === title.toLowerCase() &&
                (t.artist || '').trim().toLowerCase() === artist.toLowerCase()
            );

            if (existingIndex !== -1) {
                showToast(`"${title.toUpperCase()}" IS ALREADY IN WHAT'S IN THE LOOP!`);
                return;
            }

            const newTrack = {
                id: `loop-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
                title,
                artist,
                album: String(track.album || '').trim(),
                source: String(track.source || 'Spotify').trim() || 'Spotify',
                url: String(track.url || '').trim(),
                artworkUrl: String(track.artworkUrl || '').trim()
            };

            currentProfileData.inTheLoop.push(newTrack);
            currentProfileData.onRepeat = currentProfileData.inTheLoop[0];

            try {
                localStorage.setItem('whowho_profile_data', JSON.stringify(currentProfileData));
            } catch {}

            saveLoopToServer(currentProfileData.inTheLoop);
            if (isAdminLoggedIn) {
                saveProfileToServer(currentProfileData);
            }

            showToast(`SAVED "${title.toUpperCase()}" TO WHAT'S IN THE LOOP! VIEW WITH "🔁 WHAT'S IN THE LOOP"`);

            const addBtns = document.querySelectorAll('.now-playing-add-loop-btn');
            addBtns.forEach(btn => {
                btn.innerHTML = `✔ ADDED TO THE LOOP`;
                btn.classList.add('added');
                setTimeout(() => {
                    btn.innerHTML = `➕ ADD TO WHAT'S IN THE LOOP`;
                    btn.classList.remove('added');
                }, 2800);
            });
        }
        window.addTrackObjectToLoop = addTrackObjectToLoop;

        function enrichLoopTracksArtwork() {
            if (!Array.isArray(currentProfileData.inTheLoop)) return;
            currentProfileData.inTheLoop.forEach((trk, idx) => {
                if (!trk || (trk.artworkUrl && trk.artworkUrl !== fallbackVinylSvg)) return;
                if (!trk.title && !trk.artist) return;
                fetchArtworkAndAlbumForTrack(trk.artist, trk.title, trk.album).then(res => {
                    if (res && res.artworkUrl) {
                        trk.artworkUrl = res.artworkUrl;
                        if (res.album && !trk.album) trk.album = res.album;
                        const img = document.querySelector(`.loop-track-thumb[data-track-index="${idx}"]`);
                        if (img) img.src = res.artworkUrl;
                        try {
                            localStorage.setItem('whowho_profile_data', JSON.stringify(currentProfileData));
                        } catch {}
                        saveLoopToServer(currentProfileData.inTheLoop);
                    }
                });
            });
        }
        window.enrichLoopTracksArtwork = enrichLoopTracksArtwork;

        function handleAddTrackToLoop() {
            playArcadeBeep();
            const titleEl = document.getElementById('loop-new-title');
            const artistEl = document.getElementById('loop-new-artist');
            const albumEl = document.getElementById('loop-new-album');
            const sourceEl = document.getElementById('loop-new-source');
            const urlEl = document.getElementById('loop-new-url');
            const artworkEl = document.getElementById('loop-new-artwork');

            const title = (titleEl ? titleEl.value : '').trim();
            const artist = (artistEl ? artistEl.value : '').trim();

            if (!title || !artist) {
                showToast('TITLE AND ARTIST ARE REQUIRED!');
                return;
            }

            const newTrack = {
                id: `loop-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
                title,
                artist,
                album: (albumEl ? albumEl.value : '').trim(),
                source: (sourceEl ? sourceEl.value : 'Spotify').trim() || 'Spotify',
                url: (urlEl ? urlEl.value : '').trim(),
                artworkUrl: (artworkEl ? artworkEl.value : '').trim()
            };

            if (!Array.isArray(currentProfileData.inTheLoop)) {
                currentProfileData.inTheLoop = [];
            }

            currentProfileData.inTheLoop.push(newTrack);
            currentProfileData.onRepeat = currentProfileData.inTheLoop[0];

            try {
                localStorage.setItem('whowho_profile_data', JSON.stringify(currentProfileData));
            } catch {}
            saveLoopToServer(currentProfileData.inTheLoop);
            if (isAdminLoggedIn) {
                saveProfileToServer(currentProfileData);
            }

            // If artwork URL is empty, auto-resolve in background
            if (!newTrack.artworkUrl) {
                fetchArtworkAndAlbumForTrack(artist, title, newTrack.album).then(res => {
                    if (res && res.artworkUrl) {
                        newTrack.artworkUrl = res.artworkUrl;
                        if (res.album && !newTrack.album) newTrack.album = res.album;
                        try {
                            localStorage.setItem('whowho_profile_data', JSON.stringify(currentProfileData));
                        } catch {}
                        saveLoopToServer(currentProfileData.inTheLoop);
                        const idx = currentProfileData.inTheLoop.indexOf(newTrack);
                        if (idx !== -1) {
                            const img = document.querySelector(`.loop-track-thumb[data-track-index="${idx}"]`);
                            if (img) img.src = res.artworkUrl;
                        }
                    }
                });
            }

            showToast(`SAVED "${newTrack.title.toUpperCase()}" UNDER THE LOOP!`);
            isAddTrackFormOpen = false;
            renderPage('nowPlaying', false);
            setTimeout(enrichLoopTracksArtwork, 60);
        }
        window.handleAddTrackToLoop = handleAddTrackToLoop;

            const temp = currentProfileData.inTheLoop[index];
            currentProfileData.inTheLoop[index] = currentProfileData.inTheLoop[index - 1];
            currentProfileData.inTheLoop[index - 1] = temp;
            currentProfileData.onRepeat = currentProfileData.inTheLoop[0];

            try {
                localStorage.setItem('whowho_profile_data', JSON.stringify(currentProfileData));

            saveLoopToServer(currentProfileData.inTheLoop);

            const temp = currentProfileData.inTheLoop[index];
            currentProfileData.inTheLoop[index] = currentProfileData.inTheLoop[index + 1];

            showConfirmationModal(

            renderPage('sidequests', false);

        function playArcadeBeep(frequency = 620, endFreq = 330, duration = 0.09, type = 'square') {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                arcadeAudioContext ||= new AudioCtx();
                if (arcadeAudioContext.state === 'suspended') {
                    arcadeAudioContext.resume().catch(() => {});
                }
                const startF = Math.max(10, Number(frequency) || 620);
                const endF = Math.max(10, Number(endFreq) || 330);
                const dur = Math.max(0.01, Number(duration) || 0.09);

                const oscillator = arcadeAudioContext.createOscillator();
                const gain = arcadeAudioContext.createGain();
                const startTime = arcadeAudioContext.currentTime;

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(startF, startTime);
                oscillator.frequency.exponentialRampToValueAtTime(endF, startTime + dur * 0.85);
                gain.gain.setValueAtTime(0.0001, startTime);
                gain.gain.exponentialRampToValueAtTime(0.12, startTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
                oscillator.connect(gain);
                gain.connect(arcadeAudioContext.destination);
                oscillator.start(startTime);
                oscillator.stop(startTime + dur + 0.01);
            } catch {}
        }

        function connectLanyardSocket() {
            if (typeof WebSocket === 'undefined') return;
            if (lanyardSocket && (lanyardSocket.readyState === WebSocket.OPEN || lanyardSocket.readyState === WebSocket.CONNECTING)) {
                return;
            }

            try {
                lanyardSocket = new WebSocket('wss://api.lanyard.rest/socket');

                lanyardSocket.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        const { op, t, d } = message;

                        if (op === 1) { // Hello
                            const heartbeatInterval = d.heartbeat_interval || 30000;
                            if (lanyardSocket && lanyardSocket.readyState === WebSocket.OPEN) {
                                lanyardSocket.send(JSON.stringify({
                                    op: 2,
                                    d: {
                                        subscribe_to_id: DISCORD_USER_ID
                                    }
                                }));
                            }

                            if (lanyardHeartbeatTimer) clearInterval(lanyardHeartbeatTimer);
                            lanyardHeartbeatTimer = setInterval(() => {
                                if (lanyardSocket && lanyardSocket.readyState === WebSocket.OPEN) {
                                    lanyardSocket.send(JSON.stringify({ op: 3 }));
                                }
                            }, heartbeatInterval);
                        } else if (op === 0) { // Event
                            if (t === 'INIT_STATE' || t === 'PRESENCE_UPDATE') {
                                latestLanyardPresence = d;
                                syncDirectTrackWithLanyard(d);
                                renderUnifiedMusic();
                            }
                        }
                    } catch (err) {
                        console.warn('Lanyard socket message parse warning:', err);
                    }
                };

                lanyardSocket.onopen = () => {
                    if (lanyardReconnectTimer) {
                        clearTimeout(lanyardReconnectTimer);
                        lanyardReconnectTimer = null;
                    }
                };

                lanyardSocket.onerror = (err) => {
                    console.warn('Lanyard WebSocket notice:', err);
                };

                lanyardSocket.onclose = () => {
                    if (lanyardHeartbeatTimer) {
                        clearInterval(lanyardHeartbeatTimer);
                        lanyardHeartbeatTimer = null;
                    }
                    lanyardSocket = null;
                    if (isMonitoringNowPlaying) {
                        if (lanyardReconnectTimer) clearTimeout(lanyardReconnectTimer);
                        lanyardReconnectTimer = setTimeout(() => {
                            if (isMonitoringNowPlaying) connectLanyardSocket();
                        }, 1500);
                    }
                };
            } catch (err) {
                console.warn('Unable to initialize Lanyard WebSocket:', err);
            }
        }

                const fetchWithTimeout = async (url, timeoutMs) => {

                    const timer = setTimeout(() => controller.abort(), timeoutMs);
                    try {
                        const res = await fetch(url, { cache: 'no-store', signal: controller.signal });

                        return res.ok ? await res.json() : null;

                const [lanyardData, directData] = await Promise.all([

                    fetchWithTimeout(`/api/now-playing?_t=${Date.now()}${lastFmParam}`, 2500)
                ]);

                if (lanyardData && lanyardData.success && lanyardData.data) {
                    latestLanyardPresence = lanyardData.data;
                    syncDirectTrackWithLanyard(lanyardData.data);
                }
                if (directData) {
                    if (directData.serverTime) {

                    }
                    latestDirectTrack = directData.isPlaying ? directData : null;
                    latestDirectTracks = (directData.isPlaying && Array.isArray(directData.tracks) && directData.tracks.length > 0)

        function formatTrackTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateTrackProgress() {
            document.querySelectorAll('.lanyard-music-card').forEach(card => {
                const timeRange = card.querySelector('.lanyard-track-time-range');
                if (!timeRange || !timeRange.dataset.start) return;

                const startedAt = Number(timeRange.dataset.start);
                const endsAt = Number(timeRange.dataset.end || 0);

                if (!startedAt || startedAt <= 0) return;

                const durationSeconds = (endsAt > startedAt) ? Math.floor((endsAt - startedAt) / 1000) : 0;
                const adjustedNow = Date.now() - serverClockOffset;
                const rawElapsedSeconds = Math.max(0, Math.floor((adjustedNow - startedAt) / 1000));

                let elapsedSeconds = rawElapsedSeconds;
                if (durationSeconds > 0 && rawElapsedSeconds >= durationSeconds) {
                    // Track time finished: automatically roll over and track time again from 00:00
                    elapsedSeconds = rawElapsedSeconds % durationSeconds;

                    const cycle = Math.floor(rawElapsedSeconds / durationSeconds);
                    if (timeRange.dataset.lastCycle !== String(cycle)) {
                        timeRange.dataset.lastCycle = String(cycle);
                        // Trigger immediate fetches to capture track change or sync repeat timestamps
                        pollDirectNowPlaying();
                        fetchLanyardPresence();
                        setTimeout(pollDirectNowPlaying, 750);
                        setTimeout(fetchLanyardPresence, 1200);
                        setTimeout(pollDirectNowPlaying, 1800);
                    }
                } else {
                    if (timeRange.dataset.lastCycle) {
                        delete timeRange.dataset.lastCycle;
                    }
                }

                const formattedElapsed = formatTrackTime(elapsedSeconds);
                const elapsedEl = timeRange.querySelector('[data-elapsed-time]');
                const totalEl = timeRange.querySelector('[data-total-time]');

                if (elapsedEl) elapsedEl.textContent = formattedElapsed;
                if (durationSeconds > 0) {
                    if (totalEl) {
                        totalEl.textContent = formatTrackTime(durationSeconds);
                    } else {
                        const slash = document.createElement('span');
                        slash.className = 'time-slash';
                        slash.style.margin = '0 4px';
                        slash.style.color = '#ffd700';
                        slash.textContent = '/';
                        const tot = document.createElement('span');
                        tot.className = 'time-total';
                        tot.setAttribute('data-total-time', '');
                        tot.textContent = formatTrackTime(durationSeconds);
                        timeRange.appendChild(slash);
                        timeRange.appendChild(tot);
                    }
                }
                timeRange.style.display = 'inline-flex';
            });
        }

            let title = String(rawTitle || '').trim();

            const isGenericArtist = !artist || /^(bitchord|youtube music|spotify|apple music|music|unknown|radio|web browser|chrome|edge|firefox|opera|safari)$/i.test(artist);

            const sepMatch = title.match(/^(.*?)\s+(?:[-–—|]|(?:\/\/)|\:)\s+(.*)$/);
            if (sepMatch) {
                const left = sepMatch[1].trim();
                const right = sepMatch[2].trim();
                if (isGenericArtist) {
                    artist = left;
                    title = right;
                } else if (left.toLowerCase().includes(artist.toLowerCase())) {
                    title = right;
                }
            } else if (title.toLowerCase().includes(' by ') && isGenericArtist) {
                const byParts = title.split(/\s+by\s+/i);
                if (byParts.length >= 2) {
                    title = byParts[0].trim();
                    artist = byParts.slice(1).join(' by ').trim();
                }
            }

            const cleanA = cleanMusicArtist(artist);
            const cleanT = cleanMusicTitle(title);

            return {
                artist: cleanA || cleanMusicArtist(rawArtist),
                title: cleanT || cleanMusicTitle(rawTitle) || title,
                rawArtist,
                rawTitle
            };
        }

        async function fetchArtworkAndAlbumForTrack(artist, title, album = '') {
            const rawArtist = String(artist || '').trim();
            const rawTitle = String(title || '').trim();
            const rawAlbum = String(album || '').trim();

            if (!rawTitle && !rawArtist) return null;

            const parsed = parseArtistAndTitle(rawArtist, rawTitle);
            const cleanArtist = parsed.artist;
            const cleanTitle = parsed.title;
            const cleanAlbum = cleanMusicTitle(rawAlbum);

            if (!cleanTitle && !cleanArtist) return null;

            const key = `${cleanArtist.toLowerCase()}:::${cleanTitle.toLowerCase()}`;
            if (albumCache.has(key)) return albumCache.get(key);

            // 1. Try our dedicated backend Artwork API (/api/artwork - high res Deezer, iTunes, Spotify, & server cache)
            try {
                const apiRes = await fetch(`/api/artwork?artist=${encodeURIComponent(cleanArtist)}&title=${encodeURIComponent(cleanTitle)}&album=${encodeURIComponent(cleanAlbum)}`);
                if (apiRes.ok) {
                    const data = await apiRes.json();
                    if (data && data.artworkUrl) {
                        const resObj = {
                            artworkUrl: data.artworkUrl,
                            album: data.album || rawAlbum,
                            url: data.url || '',
                            durationMs: data.durationMs || 0
                        };
                        albumCache.set(key, resObj);
                        return resObj;
                    }
                }
            } catch (err) {
                // Backend endpoint unreachable, fall through to client-side direct resolvers
            }

            // 2. Direct client-side iTunes Search API fallback (with multi-query search & 600x600 upgrade)
            const queries = [
                cleanArtist && cleanAlbum ? `${cleanArtist} ${cleanTitle} ${cleanAlbum}` : null,
                cleanArtist ? `${cleanArtist} ${cleanTitle}` : null,
                cleanArtist ? `${cleanTitle} ${cleanArtist}` : null,
                cleanTitle,
                cleanArtist && cleanAlbum ? `${cleanArtist} ${cleanAlbum}` : null
            ].filter(Boolean);

            for (const q of queries) {
                try {
                    const term = encodeURIComponent(q);
                    const response = await fetch(`https://itunes.apple.com/search?term=${term}&entity=song&limit=5`);
                    if (response.ok) {
                        const result = await response.json();
                        if (result.results && result.results.length > 0) {
                            const pLower = cleanArtist.toLowerCase();
                            const tLower = cleanTitle.toLowerCase();
                            const cAlb = cleanAlbum.toLowerCase();

                            const match = result.results.find(item => {
                                const a = (item.artistName || '').toLowerCase();
                                const t = (item.trackName || '').toLowerCase();
                                const alb = (item.collectionName || '').toLowerCase();
                                const artistMatches = !pLower || a.includes(pLower) || pLower.includes(a);
                                const titleMatches = !tLower || t.includes(tLower) || tLower.includes(t);
                                const albumMatches = cAlb && (alb.includes(cAlb) || cAlb.includes(alb));
                                return (artistMatches && (titleMatches || albumMatches)) || (!pLower && titleMatches);
                            }) || result.results[0];

                            if (match) {
                                const rawArt = match.artworkUrl100 || match.artworkUrl60 || '';
                                const artworkUrl = rawArt ? rawArt.replace(/\/\d+x\d+bb\./, '/600x600bb.') : '';
                                if (artworkUrl) {
                                    const resObj = {
                                        artworkUrl,
                                        album: match.collectionName || rawAlbum,
                                        url: match.trackViewUrl || '',
                                        durationMs: match.trackTimeMillis || 0
                                    };
                                    albumCache.set(key, resObj);
                                    return resObj;
                                }
                            }
                        }
                    }
                } catch {}
            }

            return null;
        }

        async function fetchAlbumForTrack(artist, title) {

        function resolveDiscordAssetUrl(applicationId, assetId) {
            if (!assetId || typeof assetId !== 'string') {
                return { url: null, fallback: null };
            }
            if (assetId.startsWith('spotify:')) {
                return { url: `https://i.scdn.co/image/${assetId.slice('spotify:'.length)}`, fallback: null };
            }
            if (assetId.startsWith('youtube:')) {
                return { url: `https://i.ytimg.com/vi/${assetId.slice('youtube:'.length)}/hqdefault.jpg`, fallback: null };
            }
            if (assetId.startsWith('mp:external/')) {
                let directUrl = null;
                const match = assetId.match(/^mp:external\/[^/]+\/(https?)\/(.+)$/);
                if (match) {
                    try {
                        directUrl = `${match[1]}://${decodeURIComponent(match[2])}`;
                    } catch {
                        directUrl = `${match[1]}://${match[2]}`;
                    }
                }
                const proxyUrl = `https://media.discordapp.net/external/${assetId.slice('mp:external/'.length)}`;
                return { url: directUrl || proxyUrl, fallback: directUrl ? proxyUrl : null };
            }
            if (assetId.startsWith('http://') || assetId.startsWith('https://')) {
                return { url: assetId, fallback: null };
            }
            if (applicationId) {
                return {
                    url: `https://cdn.discordapp.com/app-assets/${applicationId}/${assetId}.png`,
                    fallback: `https://cdn.discordapp.com/app-assets/${applicationId}/${assetId}.webp`
                };
            }
            return { url: null, fallback: null };
        }

        function parseMusicActivity(activity) {
            if (!activity) return null;

            const name = (activity.name || '').trim();
            const nameLower = name.toLowerCase();
            const details = (activity.details || '').trim();
            const state = (activity.state || '').trim();
            const detailsUrl = (activity.details_url || '').trim();
            const appId = String(activity.application_id || '');
            const actType = activity.type;
            const statusDisplay = activity.status_display_type;

            const buttons = Array.isArray(activity.buttons) ? activity.buttons : [];
            const buttonTexts = [];
            const buttonUrls = [];
            for (const b of buttons) {
                if (typeof b === 'string') {
                    buttonTexts.push(String(b).toLowerCase());
                } else if (b && typeof b === 'object') {
                    if (b.label) buttonTexts.push(String(b.label).toLowerCase());
                    if (b.url) buttonUrls.push(String(b.url).toLowerCase());
                }
            }

            const largeImage = String(activity.assets?.large_image || '');
            const largeText = (activity.assets?.large_text || '').trim();
            const smallText = (activity.assets?.small_text || '').trim();

            const isBitChord = appId === '1543679166967193620' ||
                               nameLower.includes('bitchord') ||
                               buttonTexts.some(t => t.includes('bitchord')) ||
                               detailsUrl.toLowerCase().includes('bitchord');

            const isYouTubeMusic = nameLower.includes('youtube music') ||
                                   nameLower.includes('yt music') ||
                                   detailsUrl.toLowerCase().includes('music.youtube.com') ||
                                   buttonUrls.some(u => u.includes('music.youtube.com')) ||
                                   buttonTexts.some(t => t.includes('youtube music'));

            const isSpotify = nameLower.includes('spotify') ||
                              String(activity.id || '').startsWith('spotify:') ||
                              largeImage.startsWith('spotify:') ||
                              detailsUrl.toLowerCase().includes('open.spotify.com');

            const isListeningType = actType === 2 || statusDisplay === 2;
            const isOtherMusic = /apple music|soundcloud|tidal|deezer|musicbee|foobar2000|cider|aimp|winamp|vlc/i.test(name);

            if (!isBitChord && !isYouTubeMusic && !isSpotify && !isListeningType && !isOtherMusic) {
                return null;
            }

            let source = 'Music';
            if (isBitChord) {
                source = 'BitChord';
            } else if (isYouTubeMusic) {
                source = 'YouTube Music';
            } else if (isSpotify) {
                source = 'Spotify';
            } else if (name) {
                source = name;
            }

            let title = details || state || name;
            title = title.replace(/^listening to\s+/i, '').trim();

            let artist = '';
            if (details && state && details !== state) {
                artist = state.replace(/^by\s+/i, '').trim();
            }

            let album = '';
            const candidateAlbum = largeText || smallText;
            if (candidateAlbum &&
                candidateAlbum.toLowerCase() !== nameLower &&
                !/^(youtube music|bitchord|spotify)$/i.test(candidateAlbum) &&
                candidateAlbum !== title &&
                candidateAlbum !== artist) {
                album = candidateAlbum;
            }

            const { url: artworkUrl, fallback: fallbackArtworkUrl } = resolveDiscordAssetUrl(
                activity.application_id,
                activity.assets?.large_image
            );

            let url = detailsUrl || '';
            if (!url && buttonUrls.length > 0) {
                url = buttonUrls[0];
            }
            if (!url) {
                const searchQuery = encodeURIComponent(`${title} ${artist}`.trim());
                if (isYouTubeMusic || isBitChord) {
                    url = `https://music.youtube.com/search?q=${searchQuery}`;
                } else if (isSpotify) {
                    url = `https://open.spotify.com/search/${searchQuery}`;
                } else if (title) {
                    url = `https://www.google.com/search?q=${encodeURIComponent(`${source} ${title} ${artist}`.trim())}`;
                }
            }

            return {
                source,
                title,
                artist,
                album,
                artworkUrl,
                fallbackArtworkUrl,
                url,
                timestamps: activity.timestamps || null,
                device: isBitChord ? 'Desktop PC • BitChord' : '',
                deviceType: 'desktop'
            };
        }

        async function detectActiveDevicePlayback() {
            // 1. Check local browser MediaSession (active audio playing on mobile or desktop browser)
            if (typeof navigator !== 'undefined' && navigator.mediaSession && navigator.mediaSession.metadata) {
                const meta = navigator.mediaSession.metadata;
                const title = (meta.title || '').trim();
                const artist = (meta.artist || '').trim();
                const album = (meta.album || '').trim();
                let artworkUrl = '';
                if (meta.artwork && meta.artwork.length) {
                    artworkUrl = meta.artwork[meta.artwork.length - 1].src || '';
                }
                const mediaElements = Array.from(document.querySelectorAll('audio, video'));
                const hasLocalPlaying = mediaElements.some(el => !el.paused && !el.ended && el.currentTime > 0) ||
                                        navigator.mediaSession.playbackState === 'playing';

                if (title && hasLocalPlaying && !isAdvertisementTrack(title, artist, album)) {
                    const host = window.location.hostname.toLowerCase();
                    let source = 'Spotify';
                    if (host.includes('youtube')) source = 'YouTube Music';
                    else if (host.includes('apple')) source = 'Apple Music';

                    const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
                    const browserName = detectCurrentBrowserName();
                    return {
                        source,
                        title,
                        artist,
                        album,
                        artworkUrl,
                        url: '',
                        device: isMobile ? `Mobile Phone • ${browserName}` : `Desktop PC • ${browserName}`,
                        deviceType: isMobile ? 'mobile' : 'desktop'
                    };
                }
            }

            // 2. Direct broadcast track (from Windows sync script, userscript, mobile shortcuts, or live SSE)
            if (latestDirectTrack && latestDirectTrack.isPlaying && latestDirectTrack.title && !isAdvertisementTrack(latestDirectTrack.title, latestDirectTrack.artist, latestDirectTrack.album)) {
                return {
                    source: latestDirectTrack.source || 'Spotify',
                    title: latestDirectTrack.title,
                    artist: latestDirectTrack.artist || '',
                    album: latestDirectTrack.album || '',
                    artworkUrl: latestDirectTrack.artworkUrl || '',
                    url: latestDirectTrack.url || '',
                    device: latestDirectTrack.device || '',
                    deviceType: latestDirectTrack.deviceType || ''
                };
            }

            // 3. Discord Lanyard presence (Spotify & listening activities)
            if (latestLanyardPresence) {
                if (latestLanyardPresence.spotify && latestLanyardPresence.spotify.song && !isAdvertisementTrack(latestLanyardPresence.spotify.song, latestLanyardPresence.spotify.artist, latestLanyardPresence.spotify.album)) {
                    const s = latestLanyardPresence.spotify;
                    return {
                        source: 'Spotify',
                        title: s.song,
                        artist: s.artist || '',
                        album: s.album || '',
                        artworkUrl: s.album_art_url || '',
                        url: s.track_id ? `https://open.spotify.com/track/${s.track_id}` : '',
                        device: latestLanyardPresence.active_on_discord_mobile ? 'Mobile Phone' : 'Desktop PC',
                        deviceType: latestLanyardPresence.active_on_discord_mobile ? 'mobile' : 'desktop'
                    };
                }
                if (Array.isArray(latestLanyardPresence.activities)) {
                    for (const act of latestLanyardPresence.activities) {
                        const parsed = parseMusicActivity(act);
                        if (parsed && parsed.title) {
                            return parsed;
                        }
                    }
                }
            }

            // 4. Fetch live track from server API (/api/now-playing - checks Spotify API & Last.fm 24/7)
            try {
                const res = await fetch('/api/now-playing', { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.isPlaying && data.title) {
                        return {
                            source: data.source || 'Spotify',
                            title: data.title,
                            artist: data.artist || '',
                            album: data.album || '',
                            artworkUrl: data.artworkUrl || '',
                            url: data.url || '',
                            device: data.device || '',
                            deviceType: data.deviceType || ''
                        };
                    }
                }
            } catch {}

            return null;
        }
        window.detectActiveDevicePlayback = detectActiveDevicePlayback;

        async function triggerAutofillCurrentTrack(saveImmediately = false, exitEditMode = false) {
            const statusTitle = document.getElementById('autofill-status-title');
            const detectedInfo = document.getElementById('autofill-detected-info');
            const pulse = document.getElementById('autofill-pulse');

            if (statusTitle) statusTitle.textContent = 'DETECTING CURRENT PLAYBACK...';
            if (detectedInfo) detectedInfo.textContent = 'Scanning Spotify, YouTube Music, Apple Music & device...';

            const track = await detectActiveDevicePlayback();

            if (!track || !track.title) {
                if (statusTitle) statusTitle.textContent = 'STANDBY: NO LIVE STREAM DETECTED';
                if (detectedInfo) detectedInfo.textContent = 'No track actively streaming right now on your device. You can type details manually or run the sync script.';
                if (pulse) pulse.style.backgroundColor = '#ffd700';
                if (saveImmediately && exitEditMode) {
                    playArcadeBeep();
                    showToast('NO ACTIVE STREAM DETECTED ON DEVICE.');
                }
                return;
            }

            // High-resolution metadata enrichment if missing
            if ((!track.artworkUrl || !track.album) && track.artist && track.title) {
                try {
                    const resolved = await fetchArtworkAndAlbumForTrack(track.artist, track.title, track.album || '');
                    if (resolved) {
                        if (!track.album && resolved.album) track.album = resolved.album;
                        if (!track.artworkUrl && resolved.artworkUrl) track.artworkUrl = resolved.artworkUrl;
                    }
                } catch {}
            }

            if (!track.url && track.title) {
                const q = encodeURIComponent(`${track.title} ${track.artist}`.trim());
                if (/spotify/i.test(track.source)) track.url = `https://open.spotify.com/search/${q}`;
                else if (/apple/i.test(track.source)) track.url = `https://music.apple.com/search?term=${q}`;
                else track.url = `https://music.youtube.com/search?q=${q}`;
            }

            // Update UI status banner
            if (statusTitle) statusTitle.textContent = `DETECTED: ${track.title.toUpperCase()}`;
            if (detectedInfo) {
                const devText = track.device ? ` • Playing on ${track.device}` : '';

            if (pulse) pulse.style.backgroundColor = '#00ffaa';

            // 1. Autofill Section 1: BROADCAST WHAT'S PLAYING LIVE
            selectStreamingService(track.source || 'Spotify');

            const liveArtistInput = document.getElementById('live-stream-artist');
            if (liveTitleInput) liveTitleInput.value = track.title;

            // 2. Autofill Section 2: DEFAULT ON-REPEAT SONG & SETTINGS

                if (artistEl) artistEl.value = track.artist || '';
                if (albumEl) albumEl.value = track.album || '';
                if (sourceEl) sourceEl.value = track.source || 'Spotify';
                if (urlEl) urlEl.value = track.url || '';
                if (artworkEl) artworkEl.value = track.artworkUrl || '';
            }

            // 3. If saveImmediately requested, save to profile & broadcast to live stream
            if (saveImmediately) {
                currentProfileData.onRepeat = {
                    title: track.title,
                    artist: track.artist || '',
                    album: track.album || '',
                    url: track.url || '',
                    artworkUrl: track.artworkUrl || '',
                    source: track.source || 'On Repeat'
                };

                try {
                    localStorage.setItem('whowho_profile_data', JSON.stringify(currentProfileData));
                } catch {}

                saveProfileToServer(currentProfileData);

                // Broadcast to live stream
                const token = getStoredAdminToken();
                fetch('/api/now-playing', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : ''
                    },
                    body: JSON.stringify({
                        source: track.source || 'Music',
                        title: track.title,
                        artist: track.artist || '',
                        album: track.album || '',
                        artworkUrl: track.artworkUrl || '',
                        url: track.url || '',
                        device: track.device || (/Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Mobile Phone' : 'Desktop PC'),
                        deviceType: /Android|iPhone|iPad/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
                        isPlaying: true
                    })
                }).catch(() => {});

                playArcadeBeep();
                showToast(`AUTO-FILLED & SAVED: "${track.title.toUpperCase()}"!`);
                if (exitEditMode) {
                    editingSection = null;
                    renderPage('nowPlaying', false);
                }
            } else {
                playArcadeBeep();
                showToast(`AUTO-FILLED: "${track.title.toUpperCase()}"!`);

                sourceLabelHtml = '<span class="live-pulse spotify-pulse"></span> 🟢 STREAMING ON SPOTIFY';
                listenBtnClass += ' spotify';
                listenBtnText = '▶ PLAY ON SPOTIFY';
            } else if (sourceLower.includes('youtube') || sourceLower.includes('ytm')) {
                sourceClass += ' source-ytm';
                sourceLabelHtml = '<span class="live-pulse ytm-pulse"></span> 🔴 STREAMING ON YOUTUBE MUSIC';
                listenBtnClass += ' ytm';
                listenBtnText = '▶ PLAY ON YOUTUBE MUSIC';
            } else if (sourceLower.includes('apple') || sourceLower.includes('itunes')) {
                sourceClass += ' source-apple';
                sourceLabelHtml = '<span class="live-pulse apple-pulse"></span> 🍎 STREAMING ON APPLE MUSIC';
                listenBtnClass += ' apple';
                listenBtnText = '▶ PLAY ON APPLE MUSIC';
            } else if (sourceLower.includes('bitchord')) {
                sourceClass += ' source-bitchord';
                sourceLabelHtml = '<span class="live-pulse bitchord-pulse"></span> ⚡ STREAMING ON BITCHORD';
                listenBtnClass += ' bitchord';
                listenBtnText = '▶ PLAY ON BITCHORD';
            } else if (sourceLower.includes('soundcloud')) {
                sourceClass += ' source-soundcloud';
                sourceLabelHtml = '<span class="live-pulse"></span> ☁️ STREAMING ON SOUNDCLOUD';
                listenBtnClass += ' soundcloud';
                listenBtnText = '▶ PLAY ON SOUNDCLOUD';
            } else if (sourceLower.includes('tidal')) {
                sourceLabelHtml = '<span class="live-pulse"></span> 🌊 STREAMING ON TIDAL';
                listenBtnText = '▶ PLAY ON TIDAL';
            } else if (sourceLower.includes('deezer')) {
                sourceLabelHtml = '<span class="live-pulse"></span> 🟣 STREAMING ON DEEZER';
                listenBtnText = '▶ PLAY ON DEEZER';
            } else {
                sourceLabelHtml = `<span class="live-pulse"></span> STREAMING LIVE • ${escapeHtml(sourceStr.toUpperCase())}`;
            }

            const sourceLabel = document.createElement('span');
            sourceLabel.className = `lanyard-source-label ${sourceClass}`;
            sourceLabel.innerHTML = sourceLabelHtml;
            card.appendChild(sourceLabel);

            const albumArt = document.createElement('img');
            albumArt.className = 'lanyard-album-art';
            albumArt.alt = `${track.source || 'Music'} album art`;

            if (track.artworkUrl) {
                albumArt.src = track.artworkUrl;
            } else {
                albumArt.src = fallbackVinylSvg;
            }

            let hasAttemptedHeal = false;
            albumArt.onerror = () => {
                if (!hasAttemptedHeal && (track.artist || track.title)) {
                    hasAttemptedHeal = true;
                    fetchArtworkAndAlbumForTrack(track.artist, track.title, track.album).then(res => {
                        if (res && res.artworkUrl && res.artworkUrl !== albumArt.src) {
                            albumArt.src = res.artworkUrl;
                            track.artworkUrl = res.artworkUrl;
                            if (res.album && !track.album) {
                                track.album = res.album;
                                const albTitle = card.querySelector('.lanyard-album-title');
                                if (albTitle) albTitle.textContent = res.album;
                            }
                            return;
                        }
                        if (track.fallbackArtworkUrl && albumArt.src !== track.fallbackArtworkUrl) {
                            albumArt.src = track.fallbackArtworkUrl;
                            return;
                        }
                        albumArt.src = fallbackVinylSvg;
                    }).catch(() => {
                        albumArt.src = fallbackVinylSvg;
                    });
                    return;
                }
                if (track.fallbackArtworkUrl && albumArt.src !== track.fallbackArtworkUrl) {
                    albumArt.src = track.fallbackArtworkUrl;
                    return;
                }
                albumArt.src = fallbackVinylSvg;
            };
            card.appendChild(albumArt);

            const trackInfo = document.createElement('div');
            trackInfo.className = 'lanyard-track-info';

            const trackTitle = document.createElement(track.url ? 'a' : 'p');
            trackTitle.className = 'lanyard-track-link';
            trackTitle.textContent = track.title || `Listening on ${track.source}`;
            if (track.url) {
                trackTitle.href = track.url;
                trackTitle.target = '_blank';
                trackTitle.rel = 'noopener noreferrer';
            }
            trackInfo.appendChild(trackTitle);

            const trackDetails = document.createElement('div');
            trackDetails.className = 'lanyard-track-details';
            if (track.artist) {
                const artist = document.createElement('span');
                artist.className = 'lanyard-track-artists';
                artist.textContent = track.artist;
                trackDetails.appendChild(artist);
            }

            // Determine track timestamps and timing preserving device start time
            let timestamps = track.timestamps || {};
            let startedAt = Number(timestamps.start) || 0;
            let endsAt = Number(timestamps.end) || 0;

            if (startedAt <= 0 && track.positionMs) {
                startedAt = Date.now() - Number(track.positionMs);
            }

            if (track.durationMs > 0) {
                if (startedAt <= 0) {
                    startedAt = Date.now();
                }
                if (endsAt <= startedAt) {
                    endsAt = startedAt + Number(track.durationMs);
                }
                track.timestamps = { start: startedAt, end: endsAt };
            } else if (startedAt > 0 && endsAt > startedAt) {
                track.durationMs = endsAt - startedAt;
            }

            const hasTiming = Number.isFinite(startedAt) && startedAt > 0;

            // Construct album line with live start-to-finish track time placed immediately after album name
            const albumContainer = document.createElement('div');
            albumContainer.className = 'lanyard-track-album-line';

            const albumTitleSpan = document.createElement('span');
            albumTitleSpan.className = 'lanyard-album-title';
            albumTitleSpan.textContent = track.album || '';
            albumContainer.appendChild(albumTitleSpan);

            const timeRangeSpan = document.createElement('span');
            timeRangeSpan.className = 'lanyard-track-time-range';

            if (hasTiming) {
                const durationSeconds = (endsAt > startedAt) ? Math.floor((endsAt - startedAt) / 1000) : 0;
                const adjustedNow = Date.now() - serverClockOffset;
                const rawElapsedSeconds = Math.max(0, Math.floor((adjustedNow - startedAt) / 1000));
                const elapsedSeconds = durationSeconds > 0 && rawElapsedSeconds >= durationSeconds
                    ? (rawElapsedSeconds % durationSeconds)
                    : rawElapsedSeconds;

                timeRangeSpan.dataset.start = String(startedAt);
                if (endsAt > startedAt) {
                    timeRangeSpan.dataset.end = String(endsAt);
                }
                const bullet = track.album ? `<span class="time-sep">•</span> ` : '';
                const totalDisplay = durationSeconds > 0 
                    ? `<span class="time-slash" style="margin: 0 4px; color: #ffd700;">/</span> <span class="time-total" data-total-time>${formatTrackTime(durationSeconds)}</span>`
                    : '';
                timeRangeSpan.innerHTML = `${bullet}<span class="time-elapsed" data-elapsed-time>${formatTrackTime(elapsedSeconds)}</span> ${totalDisplay}`;
                timeRangeSpan.style.display = 'inline-flex';
            } else {
                timeRangeSpan.style.display = 'none';
            }
            albumContainer.appendChild(timeRangeSpan);

            if (track.album || hasTiming) {
                trackDetails.appendChild(albumContainer);
            }

            // Explicit Streaming Service Origin Badge
            const serviceBadge = document.createElement('span');
            serviceBadge.className = `streaming-service-badge ${sourceLower.includes('spotify') ? 'spotify' : sourceLower.includes('youtube') || sourceLower.includes('ytm') ? 'ytm' : sourceLower.includes('apple') ? 'apple' : sourceLower.includes('bitchord') ? 'bitchord' : ''}`;
            serviceBadge.innerHTML = `📡 <b>STREAMED FROM:</b> ${escapeHtml(sourceStr.toUpperCase())}`;
            trackDetails.appendChild(serviceBadge);

            // Asynchronous enrichment for missing artwork, album, or duration
            if ((track.artist || track.title) && (!track.artworkUrl || track.artworkUrl === fallbackVinylSvg || albumArt.src === fallbackVinylSvg || !track.album || !track.durationMs)) {
                fetchArtworkAndAlbumForTrack(track.artist, track.title, track.album).then(res => {
                    if (res) {
                        if (res.artworkUrl && (!track.artworkUrl || track.artworkUrl === fallbackVinylSvg || albumArt.src === fallbackVinylSvg)) {
                            albumArt.src = res.artworkUrl;
                            track.artworkUrl = res.artworkUrl;
                        }
                        if (res.album && !track.album) {
                            track.album = res.album;
                            albumTitleSpan.textContent = res.album;
                            if (timeRangeSpan && !timeRangeSpan.querySelector('.time-sep')) {
                                const sep = document.createElement('span');
                                sep.className = 'time-sep';
                                sep.textContent = '•';
                                sep.style.marginRight = '5px';
                                timeRangeSpan.insertBefore(sep, timeRangeSpan.firstChild);
                            }
                            if (!albumContainer.parentElement) {
                                trackDetails.insertBefore(albumContainer, serviceBadge);
                            }
                        }
                        if (res.durationMs > 0 && (!track.timestamps || !track.timestamps.end)) {
                            const s = Number(track.timestamps?.start) || startedAt || Date.now();
                            const e = s + Number(res.durationMs);
                            track.timestamps = { start: s, end: e };
                            track.durationMs = res.durationMs;
                            const durSec = Math.floor(res.durationMs / 1000);
                            timeRangeSpan.dataset.start = String(s);
                            timeRangeSpan.dataset.end = String(e);
                            const bullet = track.album ? `<span class="time-sep">•</span> ` : '';
                            const adjustedNow = Date.now() - serverClockOffset;
                            const rawElapsed = Math.max(0, Math.floor((adjustedNow - s) / 1000));
                            const elapsedSec = (durSec > 0 && rawElapsed >= durSec) ? (rawElapsed % durSec) : rawElapsed;
                            timeRangeSpan.innerHTML = `${bullet}<span class="time-elapsed" data-elapsed-time>${formatTrackTime(elapsedSec)}</span> <span class="time-slash" style="margin: 0 4px; color: #ffd700;">/</span> <span class="time-total" data-total-time>${formatTrackTime(durSec)}</span>`;
                            timeRangeSpan.style.display = 'inline-flex';
                            if (!albumContainer.parentElement) {
                                trackDetails.insertBefore(albumContainer, serviceBadge);
                            }
                            if (!trackProgressTimer) {
                                updateTrackProgress();
                                trackProgressTimer = setInterval(updateTrackProgress, 1000);
                            }
                        }
                    }
                });
            }

            trackInfo.appendChild(trackDetails);

            // Where it plays badge (Device & Streaming Platform Indicator)
            const deviceRaw = (track.device || '').trim();
            const deviceType = (track.deviceType || '').toLowerCase();
            let devIcon = '🎧';
            let devLabel = '';
            let isMobileDev = false;
            let isTabletDev = false;

            if (deviceType === 'tablet' || /tablet|ipad/i.test(deviceRaw)) {
                devIcon = '📟';
                isTabletDev = true;
            } else if (deviceType === 'mobile' || /mobile|phone|iphone|android/i.test(deviceRaw)) {
                devIcon = '📱';
                isMobileDev = true;
            } else if (deviceType === 'desktop' || /desktop|pc|windows|mac|linux|brave|zen|opera|librewolf|vivaldi|arc|waterfox|floorp|thorium|chromium|chrome|firefox|edge/i.test(deviceRaw)) {
                devIcon = '💻';
            }

            const cleanDev = String(deviceRaw || '')
                .replace(/â€¢/g, ' • ')
                .replace(/[\uFFFD\?]+/g, ' • ')
                .replace(/(?:\s*[.\-•·●\u2022\u00B7\u25CF•]+\s*)+/g, ' • ')
                .replace(/^[\s\.\-•]+|[\s\.\-•]+$/g, '')
                .trim();
            if (cleanDev) {
                if (/^playing\s+(on|via)/i.test(cleanDev)) {
                    devLabel = cleanDev.toUpperCase();
                } else {
                    devLabel = `PLAYING ON ${cleanDev.toUpperCase()}`;
                }
            } else {
                devLabel = isTabletDev ? `PLAYING VIA ${sourceStr.toUpperCase()} ON TABLET` : isMobileDev ? `PLAYING VIA ${sourceStr.toUpperCase()} ON MOBILE PHONE` : `PLAYING VIA ${sourceStr.toUpperCase()} ON DESKTOP PC`;
            }

            if (devLabel) {
                const devBadge = document.createElement('div');
                const devClass = isTabletDev ? 'tablet-device' : (isMobileDev ? 'mobile-device' : 'desktop-device');
                devBadge.className = `lanyard-device-pill ${devClass}`;
                devBadge.innerHTML = `
                    <span class="device-pill-icon">${devIcon}</span>
                    <span class="device-pill-text">${escapeHtml(devLabel)}</span>
                    <span class="retro-eq-bars" title="Audio playing live">
                        <span class="retro-bar bar-1"></span>
                        <span class="retro-bar bar-2"></span>
                        <span class="retro-bar bar-3"></span>
                        <span class="retro-bar bar-4"></span>
                    </span>
                `;
                trackInfo.appendChild(devBadge);
            }

            if (track.url) {
                const listenBtn = document.createElement('a');
                listenBtn.className = listenBtnClass;
                listenBtn.href = track.url;
                listenBtn.target = '_blank';
                listenBtn.rel = 'noopener noreferrer';
                listenBtn.textContent = listenBtnText;
                trackInfo.appendChild(listenBtn);
            }

            // Button under Play on Spotify to add the song to What's in the loop
            if (track.title) {
                const addToLoopBtn = document.createElement('button');
                addToLoopBtn.type = 'button';
                addToLoopBtn.className = 'now-playing-add-loop-btn';
                addToLoopBtn.innerHTML = `➕ ADD TO WHAT'S IN THE LOOP`;
                addToLoopBtn.title = "Save this track directly under What's in the loop";
                addToLoopBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    addTrackObjectToLoop(track);
                });
                trackInfo.appendChild(addToLoopBtn);
            }

            card.appendChild(trackInfo);
            return { element: card, hasTiming };
        }
