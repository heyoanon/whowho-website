<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background-color: #000000;
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    letter-spacing: 1px;
}

.split-container {
    display: flex;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

.left-half,
.right-half {
    width: 50%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.left-half {
    background-color: #000000;
    padding: 0;
    overflow: hidden;
    align-items: stretch;
    justify-content: stretch;
}

.right-half {
    background-color: #000000;
    padding: 20px 24px;
    height: calc(100vh - 80px);
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    border: 3px solid #004cff;
    box-shadow: 0 0 10px #004cff, 0 0 20px #004cff, inset 0 0 10px rgba(0, 76, 255, 0.2);
    border-radius: 12px;
    margin: 40px 40px 40px 20px;
    background: rgba(0, 0, 0, 0.7);
    width: 85%;
    max-width: 650px; 
    min-width: 420px;
    min-height: 0;
    align-self: flex-start;
    overflow-y: hidden;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: #004cff #000000;
}

.menu-panel {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: flex-start;
    text-align: left;
    min-height: 100%;
    justify-content: center;
    position: relative;
}

.sub-menu {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 6px;
    padding-left: 2px;
    align-items: flex-start;
}

.menu-panel .menu-item,
.sub-menu .menu-item {
    align-self: flex-start;
    text-align: left;
    white-space: nowrap;
}

.menu-panel h1 {
    align-self: center;
    margin-left: 0;
    text-align: center;
}

.profile-menu-panel,
.who-i-ult-menu-panel {
    position: relative;
}

.profile-menu-panel > .sub-menu,
.who-i-ult-menu-panel > .sub-menu {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    margin-top: 0;
    transform: translateY(-50%);
}

.panel-content-only {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.top-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.back-button {
    background: transparent;
    border: 2px solid #004cff;
    color: #004cff;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 0 8px #004cff;
}

.back-button:hover {
    background: rgba(0, 76, 255, 0.1);
}

.whoami-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: 42% center;
    min-height: 100vh;
}

h1 {
    margin: 0 0 18px 0;
    font-size: 40px;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 0 8px #ffffff;
}

h2 {
    margin: 0 0 16px;
    font-size: 30px;
    color: #004cff;
    text-transform: uppercase;
}

h3 {
    margin: 0 0 8px;
    font-size: 12px;
    color: #ffffff;
    text-transform: uppercase;
}

.menu-item {
    background: transparent;
    border: none;
    color: #ffffff;
    font-family: 'Press Start 2P', monospace;
    text-align: left;
    padding: 0;
    cursor: pointer;
    font-size: 30px;
    text-transform: uppercase;
    transition: all 0.2s ease;
    position: relative;
    letter-spacing: 1px;
    outline: none;
    display: block;
    width: fit-content;
    line-height: 2;
}

.menu-item::before {
    content: '>';
    opacity: 0;
    color: #004cff;
    margin-right: 8px;
    transition: opacity 0.2s ease;
}

.menu-item:hover::before,
.menu-item.active::before,
.menu-item:focus::before {
    opacity: 1;
}

.menu-item:hover,
.menu-item.active,
.menu-item:focus {
    color: #004cff;
    transform: translateX(4px);
    text-shadow: 0 0 8px #004cff;
}

.sub-menu .menu-item {
    display: block;
    width: fit-content;
}

.panel-content {
    width: 100%;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.fact-box {
    border: 2px solid #004cff;
    background: rgba(0, 0, 0, 0.55);
    box-shadow: inset 0 0 8px rgba(0, 76, 255, 0.12);
    padding: 14px 12px;
    border-radius: 8px;
}

.know-me-box {
    position: relative;
    overflow: visible;
    padding-right: 110px;
}

.blue-cat-cap-image {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 130px;
    height: 130px;
    object-fit: contain;
    opacity: 0.95;
    filter: drop-shadow(0 0 8px rgba(0, 76, 255, 0.35));
    pointer-events: none;
}

.know-me-grid {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.know-me-grid p {
    margin: 0;
    line-height: 1.8;
}

.social-links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
}

.social-link {
    display: block;
    width: fit-content;
    color: #ffffff;
    text-decoration: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    line-height: 1.6;
    border: 2px solid #004cff;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 8px;
    padding: 8px 10px;
    transition: all 0.2s ease;
    box-shadow: 0 0 8px rgba(0, 76, 255, 0.25);
}

.social-link:hover,
.social-link:focus {
    color: #004cff;
    transform: translateX(4px);
    text-shadow: 0 0 8px #004cff;
    background: rgba(0, 76, 255, 0.08);
}

.fact-box p,
.fact-box li {
    color: #ffffff;
    font-size: 20px;
    line-height: 1.8;
    margin: 0;
    text-transform: none;
    letter-spacing: 0.5px;
}

.panel-content .fact-box p {
    font-size: 20px;
    line-height: 1.6;
}

.panel-content .fact-box li,
.panel-content .fact-box ul,
.panel-content .fact-box p {
    font-size: 20px;
}

.fact-box ul {
    margin: 0;
    padding-left: 18px;
}

.fact-box li + li {
    margin-top: 8px;
}

.known-facts-panel,
.unknown-facts-panel,
.hobbies-panel {
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.scrollable-facts-box {
    flex: 1 1 0;
    max-height: 100%;
    min-height: 0;
    overflow-y: scroll;
    overflow-x: hidden;
    scrollbar-width: auto;
    scrollbar-color: #7fb7ff #050b17;
    scrollbar-gutter: stable;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
}

.scrollable-facts-box::-webkit-scrollbar {
    width: 12px;
}

.scrollable-facts-box::-webkit-scrollbar-track {
    background: #050b17;
    border: 2px solid rgba(0, 76, 255, 0.35);
    border-radius: 999px;
}

.scrollable-facts-box::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #94c1ff, #004cff, #0031a6);
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 10px rgba(0, 76, 255, 0.9);
}

.socials-box {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: auto;
    scrollbar-color: #7fb7ff #050b17;
    scrollbar-gutter: stable;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
}

.socials-box::-webkit-scrollbar {
    width: 12px;
}

.socials-box::-webkit-scrollbar-track {
    background: #050b17;
    border: 2px solid rgba(0, 76, 255, 0.35);
    border-radius: 999px;
}

.socials-box::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #94c1ff, #004cff, #0031a6);
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 10px rgba(0, 76, 255, 0.9);
}

.lanyard-box {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 0;
    padding: 16px 28px;
}

.lanyard-music-list {
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    flex-direction: column;
    width: 100%;
    gap: 16px;
}

.lanyard-music-card {
    display: grid;
    flex: 1 1 100%;
    min-width: 0;
    max-width: none;
    grid-template-columns: 180px minmax(0, 1fr);
    grid-template-areas:
        "source source"
        "art info";
    align-items: center;
    gap: 12px 24px;
    text-align: left;
}

.lanyard-music-card.no-art {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas:
        "source"
        "info";
}

.lanyard-music-card + .lanyard-music-card {
    padding-top: 16px;
    border-top: 1px dashed rgba(0, 76, 255, 0.4);
}

.lanyard-source-label {
    grid-area: source;
    color: #9ab7ff;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
}

.now-playing-panel {
    text-align: center;
}

.lanyard-album-art {
    grid-area: art;
    width: 180px;
    height: 180px;
    flex: 0 0 180px;
    border: 2px solid #004cff;
    border-radius: 8px;
    object-fit: cover;
    box-shadow: 0 0 10px rgba(0, 76, 255, 0.35);
}

.lanyard-track-info {
    grid-area: info;
    display: flex;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    text-align: left;
}

.panel-content .lanyard-track-info .lanyard-track-details,
.lanyard-track-details {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin: 0;
    width: 100%;
    max-width: 100%;
    gap: 3px;
    text-align: left;
}

.lanyard-track-artists {
    display: block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #ffffff;
    font-size: 15px;
    line-height: 1.4;
}

.lanyard-track-album-line {
    display: block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #9ab7ff;
    font-size: 13px;
    line-height: 1.4;
}

.lanyard-track-link {
    display: block;
    max-width: 100%;
    margin: 0;
    overflow: hidden;
    color: #9ab7ff;
    font-size: 18px;
    line-height: 1.5;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
}

.lanyard-track-link:hover,
.lanyard-track-link:focus {
    color: #ffffff;
}

.lanyard-album-art[hidden],
.lanyard-music-list[hidden],
.lanyard-track-artists[hidden],
.lanyard-track-album-line[hidden],
.lanyard-track-link[hidden],
.lanyard-activity[hidden],
.lanyard-track-timing[hidden] {
    display: none;
}

.lanyard-track-timing {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 10px;
    color: #ffffff;
    font-size: 14px;
}

.lanyard-activity {
    width: 100%;
    color: #9ab7ff;
    text-align: center;
}

.lanyard-empty-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    width: 100%;
    padding: 10px 0;
}

.lanyard-activity-title {
    color: #ffffff;
    font-size: 18px;
    margin: 0;
    line-height: 1.5;
}

.lanyard-hint {
    color: #9ab7ff;
    font-size: 13px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.6;
}

.lanyard-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #ffffff;
    background: rgba(0, 76, 255, 0.2);
    border: 1px solid #004cff;
    padding: 4px 12px;
    border-radius: 999px;
    margin-top: 4px;
}

.lanyard-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #747f8d;
}

.lanyard-status-dot.online {
    background: #3ba55d;
    box-shadow: 0 0 6px #3ba55d;
}

.lanyard-status-dot.dnd {
    background: #ed4245;
    box-shadow: 0 0 6px #ed4245;
}

.lanyard-status-dot.idle {
    background: #faa81a;
    box-shadow: 0 0 6px #faa81a;
}

.lanyard-refresh-button {
    font-family: inherit;
    font-size: 12px;
    color: #004cff;
    background: #ffffff;
    border: 2px solid #004cff;
    border-radius: 4px;
    padding: 6px 16px;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
}

.lanyard-refresh-button:hover,
.lanyard-refresh-button:focus {
    background: #004cff;
    color: #ffffff;
    box-shadow: 0 0 8px rgba(0, 76, 255, 0.6);
}

/* Profile Header, Tabs, and Edit Controls */
.profile-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 8px;
    gap: 12px;
}

.profile-header-row h2 {
    margin: 0;
}

.edit-profile-btn {
    font-family: inherit;
    font-size: 11px;
    color: #ffffff;
    background: rgba(0, 76, 255, 0.2);
    border: 2px solid #004cff;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}

.edit-profile-btn:hover,
.edit-profile-btn:focus {
    background: #004cff;
    color: #ffffff;
    box-shadow: 0 0 10px rgba(0, 76, 255, 0.7);
    transform: translateY(-1px);
}

.edit-profile-btn.locked {
    border-color: rgba(0, 76, 255, 0.45);
    color: #9ab7ff;
    background: rgba(0, 0, 0, 0.4);
}

.edit-profile-btn.locked:hover,
.edit-profile-btn.locked:focus {
    border-color: #004cff;
    color: #ffffff;
    background: rgba(0, 76, 255, 0.25);
    box-shadow: 0 0 10px rgba(0, 76, 255, 0.6);
}

.admin-logout-btn {
    font-family: inherit;
    font-size: 10px;
    color: #ffb1b1;
    background: rgba(255, 0, 60, 0.15);
    border: 2px solid rgba(255, 0, 60, 0.5);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    align-self: flex-start;
}

.admin-logout-btn:hover,
.admin-logout-btn:focus {
    background: #ff003c;
    color: #ffffff;
    border-color: #ffffff;
    box-shadow: 0 0 10px rgba(255, 0, 60, 0.7);
    transform: translateY(-1px);
}

.ult-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    width: 100%;
}

.ult-tab-btn {
    font-family: inherit;
    font-size: 12px;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.5);
    border: 2px solid #004cff;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.2s;
}

.ult-tab-btn.active,
.ult-tab-btn:hover {
    background: #004cff;
    color: #ffffff;
    box-shadow: 0 0 8px rgba(0, 76, 255, 0.6);
}

.ult-category-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
}

.ult-category-group:last-child {
    margin-bottom: 0;
}

.ult-cat-title {
    color: #9ab7ff;
    font-size: 14px;
    letter-spacing: 0.5px;
    margin: 0;
}

.ult-cat-items {
    color: #ffffff;
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
}

.profile-edit-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
}

.profile-form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
}

.profile-form-label {
    color: #9ab7ff;
    font-size: 11px;
    letter-spacing: 0.5px;
}

.profile-input-field {
    background: rgba(0, 0, 0, 0.65);
    border: 2px solid #004cff;
    color: #ffffff;
    border-radius: 6px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    width: 100%;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.profile-input-field:focus,
.profile-textarea-field:focus {
    outline: none;
    border-color: #9ab7ff;
    box-shadow: 0 0 10px rgba(0, 76, 255, 0.7);
}

.profile-textarea-field {
    background: rgba(0, 0, 0, 0.65);
    border: 2px solid #004cff;
    color: #ffffff;
    border-radius: 6px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.6;
    width: 100%;
    min-height: 160px;
    resize: vertical;
    box-sizing: border-box;
}

.profile-edit-actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
}

.btn-save-profile {
    font-family: inherit;
    font-size: 12px;
    color: #ffffff;
    background: #004cff;
    border: 2px solid #ffffff;
    border-radius: 6px;
    padding: 8px 16px;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(0, 76, 255, 0.5);
    transition: all 0.2s;
}

.btn-save-profile:hover,
.btn-save-profile:focus {
    background: #1a62ff;
    box-shadow: 0 0 14px rgba(0, 76, 255, 0.8);
    transform: translateY(-1px);
}

.btn-cancel-profile {
    font-family: inherit;
    font-size: 12px;
    color: #9ab7ff;
    background: transparent;
    border: 2px solid rgba(0, 76, 255, 0.6);
    border-radius: 6px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-cancel-profile:hover,
.btn-cancel-profile:focus {
    color: #ffffff;
    border-color: #004cff;
    background: rgba(0, 76, 255, 0.15);
}

/* Confirmation Modal */
.confirm-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(5px);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fadeInModal 0.15s ease-out;
}

@keyframes fadeInModal {
    from { opacity: 0; }
    to { opacity: 1; }
}

.confirm-modal-box {
    background: #050b17;
    border: 3px solid #004cff;
    border-radius: 12px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 30px rgba(0, 76, 255, 0.7), inset 0 0 12px rgba(0, 76, 255, 0.25);
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-sizing: border-box;
}

.confirm-modal-title {
    color: #ffffff;
    font-size: 15px;
    margin: 0;
    letter-spacing: 0.5px;
}

.confirm-modal-desc {
    color: #9ab7ff;
    font-size: 12px;
    line-height: 1.6;
    margin: 0;
}

.confirm-modal-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.confirm-modal-btn {
    font-family: inherit;
    font-size: 11px;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
}

.confirm-modal-btn.confirm {
    background: #004cff;
    color: #ffffff;
    border: 2px solid #ffffff;
    box-shadow: 0 0 8px rgba(0, 76, 255, 0.6);
}

.confirm-modal-btn.confirm:hover {
    background: #1a62ff;
    box-shadow: 0 0 14px rgba(0, 76, 255, 0.9);
}

.confirm-modal-btn.cancel {
    background: transparent;
    color: #ffffff;
    border: 2px solid rgba(255, 255, 255, 0.35);
}

.confirm-modal-btn.cancel:hover {
    border-color: #ffffff;
    background: rgba(255, 255, 255, 0.08);
}

.profile-save-toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #004cff;
    color: #ffffff;
    border: 2px solid #ffffff;
    padding: 10px 18px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 11px;
    box-shadow: 0 0 16px rgba(0, 76, 255, 0.8);
    z-index: 100000;
    pointer-events: none;
    animation: fadeInToast 0.2s ease-out;
}

@keyframes fadeInToast {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.quest-progress-wrap {

.quest-empty-msg {

.quest-edit-list {

.random-game-panel {

.game-description {

.arcade-btn {

    align-items: center;
    justify-content: center;

}

.arcade-btn.roll {

.arcade-btn.roll:hover,
.arcade-btn.roll:focus {

}

.arcade-btn.play,

}

.arcade-btn.play:hover,
.arcade-btn.play:focus,
.arcade-btn.play-external:hover,
.arcade-btn.play-external:focus {
    background: #ff0064;
    color: #ffffff;
    box-shadow: 0 0 16px #ff0064;
    transform: translateY(-1px);
}

.arcade-btn.play-arcade {

}

.arcade-btn.play-arcade:focus {

.arcade-player-panel {

.arcade-player-title-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.arcade-player-game-name {

}

.arcade-mini-btn {

.arcade-game-tabs {
    display: flex;

    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
}

.arcade-tab-btn {
    font-family: inherit;
    font-size: 9px;
    padding: 6px 10px;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(0, 76, 255, 0.4);
    color: #8bb6ff;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.arcade-tab-btn:hover,
.arcade-tab-btn.active {

    box-shadow: 0 0 10px rgba(0, 76, 255, 0.6);
}

.arcade-screen-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000000;
    border: 3px solid #004cff;
    border-radius: 10px;
    box-shadow: 0 0 18px rgba(0, 76, 255, 0.4), inset 0 0 14px rgba(0, 76, 255, 0.2);

    max-width: 300px;
    max-height: 300px;
    width: 100%;
    aspect-ratio: 1 / 1;
}

#arcade-canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000000;
    display: block;
}

.arcade-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
    z-index: 10;
    text-align: center;
    padding: 16px;
}

.arcade-overlay p {
    font-size: 13px;
    color: #ff0055;
    text-shadow: 0 0 10px #ff0055;
    letter-spacing: 1px;
    margin: 0;
}

.arcade-controls-container {
    display: flex;
    justify-content: space-around;
    align-items: center;

    user-select: none;
    -webkit-user-select: none;
}

.arcade-dpad {
    display: grid;
    grid-template-columns: 42px 42px 42px;
    grid-template-rows: 42px 42px 42px;
    gap: 3px;
    touch-action: none;
}

.dpad-btn {
    background: #111a33;
    border: 2px solid #004cff;
    color: #9ab7ff;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.1s ease;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

.dpad-btn:active,
.dpad-btn.pressed {
    background: #004cff;
    color: #ffffff;
    box-shadow: 0 0 10px #004cff;
    transform: scale(0.92);
}

.dpad-btn.up {
    grid-column: 2;
    grid-row: 1;
}

.dpad-btn.left {
    grid-column: 1;
    grid-row: 2;
}

.dpad-center {
    grid-column: 2;
    grid-row: 2;
    background: #080d1a;
    border: 1px solid rgba(0, 76, 255, 0.3);
    border-radius: 4px;
}

.dpad-btn.right {
    grid-column: 3;
    grid-row: 2;
}

.dpad-btn.down {
    grid-column: 2;
    grid-row: 3;
}

.arcade-action-cluster {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    touch-action: none;
}

.action-btn.fire {

    height: 58px;
    border-radius: 50%;

    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(255, 0, 85, 0.6);
    transition: all 0.1s ease;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

.action-btn.fire:active,
.action-btn.fire.pressed {
    background: #ff0055;
    box-shadow: 0 0 22px #ff0055;
    transform: scale(0.92);
}

.arcade-btn-label {
    font-size: 8px;

}

.arcade-desktop-hint {

.btn-roll-game {
    font-family: inherit;
    font-size: 11px;
    padding: 6px 12px;
    background: rgba(0, 76, 255, 0.2);
    border: 2px solid #004cff;
    color: #ffffff;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;

.btn-roll-game:hover,

.lanyard-track-progress-fill {

.message-submit:hover,

    color: #004cff;

<body>

        <div class="right-half" id="right-panel">

                <button class="menu-item active" data-page="profile">PROFILE</button>

                <button class="menu-item" data-page="randomGame">RANDOM GAME</button>
            </div>
        </div>
    </div>

    <script>
        const registeredEmail = 'danyaellap@gmail.com';

        const defaultProfileData = {
            knowMe: {
                name: 'DAN',
                nickname: 'ANON, DADA',
                age: '19',
                country: 'PHILIPPINES',
                timezone: 'GMT +8',
                pronouns: 'SHE/THEY'
            },
            knownFacts: [
                "Currently, I'm a 2nd Year College Student.",
                "I enjoy making stuff, especially related  to music and interior design",
                "I also like experimenting stuff overall.",
                "English is not my first languange so I have sometimes a hard time talking to.",
                "I rarely open dms so if I don't reply, please don't take it personally."
            ],
            unknownFacts: [
                "I like to collect stuff related to games, especially card games, legos, and tech devices",
                "I'm secretely into arcade games and vintage/retro stuff.",
                "One day I want to build a whole game from scratch.",
                "I'm a big fan of the 80s, 90s pop culture and K-pop girl groups.",
                "A Humanities and Social Sciences graduate who took a STEM degree in college so expect that I'm busy for most of the time."
            ],
            hobbies: [
                "Gaming (retro arcade & rhythm games)",
                "Building Lego sets and collecting tech devices",
                "Coding and web development experiments",
                "Listening to music and curating playlists",
                "Interior aesthetic design and creative crafts"
            ],
            ultBias: {
                kpop: 'Winter, Seulgi, Mina, Yoon, Minji, Kazuha, Chaewon, Minju, Haewon, Lily',
                thaiGl: 'Freen, Becky, Milk, Love, Caprice, Pangjie',
                ppop: 'Mikha, Gwen, Colet, Aiah, Mable',
                other: 'Krystal'
            },
            ultGroups: {
                mainUlt: 'aespa, Nmixx, Red Velvet, Stayc, Twice, Cortis',
                stanGroups: 'Blackpink, Itzy, Le Sserafim, NewJeans, Loona, Kep1er, Iz*one, IVE, GFriend, Mamamoo, WJSN, SNSD',
                boyGroups: 'ILLIT, NCT and its sub-units, Seventeen, Stray Kids, EXO, Tomorrow X Together'
            },
            sidequests: [
                { id: 'sq-1', text: 'Expand my knowledge in coding and designing.', done: false },
                { id: 'sq-2', text: 'Make a website based on what it needs.', done: true },
                { id: 'sq-3', text: 'Keep learning unexpectedly.', done: false }
            ]
        };

        let currentProfileData = JSON.parse(JSON.stringify(defaultProfileData));
        let editingSection = null;
        let isEditingSideQuests = false;
        let isAdminLoggedIn = false;

        function getStoredAdminToken() {
            return sessionStorage.getItem('whowho_admin_token') || localStorage.getItem('whowho_admin_token') || '';
        }

        function setStoredAdminToken(token) {
            if (token) {
                sessionStorage.setItem('whowho_admin_token', token);
                localStorage.setItem('whowho_admin_token', token);
                isAdminLoggedIn = true;
            } else {
                sessionStorage.removeItem('whowho_admin_token');
                localStorage.removeItem('whowho_admin_token');
                isAdminLoggedIn = false;
            }
        }

        async function checkAdminStatus() {
            const token = getStoredAdminToken();
            if (!token) {
                isAdminLoggedIn = false;
                return false;
            }
            try {
                const res = await fetch('/api/admin/status', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    isAdminLoggedIn = Boolean(data && data.isAdmin);
                    if (!isAdminLoggedIn) setStoredAdminToken(null);
                } else {
                    isAdminLoggedIn = false;
                    setStoredAdminToken(null);
                }
            } catch {
                isAdminLoggedIn = Boolean(token);
            }
            return isAdminLoggedIn;
        }

        function logoutAdmin() {
            playArcadeBeep();
            setStoredAdminToken(null);
            editingSection = null;
            isEditingSideQuests = false;
            showToast('LOGGED OUT OF OWNER MODE.');
            const hash = (window.location.hash || '').replace(/^#/, '').trim();
            if (DETAIL_PAGES.includes(hash)) {
                renderDetail(hash, false);
            } else if (TOP_PAGES.includes(hash)) {
                renderPage(hash, false);
            } else {
                renderMainMenu(false);
            }
        }

        window.logoutAdmin = logoutAdmin;

        function showAdminPasswordModal(actionPrompt, onAuthenticated) {
            playArcadeBeep();
            const existing = document.getElementById('admin-auth-modal');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.id = 'admin-auth-modal';
            overlay.className = 'confirm-modal-overlay';
            overlay.innerHTML = `
                <div class="confirm-modal-box admin-auth-box" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
                    <h3 class="confirm-modal-title" id="admin-modal-title">👑 OWNER / ADMIN ACCESS</h3>
                    <p class="confirm-modal-desc">${escapeHtml(actionPrompt || 'Only the owner of the website can edit this section.')}<br><br>ENTER ADMIN PASSWORD:</p>
                    <form id="admin-auth-form" onsubmit="event.preventDefault(); submitAdminPassword();" style="display:flex; flex-direction:column; gap:12px; width:100%;">
                        <input type="password" id="admin-password-input" class="profile-input-field" placeholder="Enter password..." autocomplete="current-password" required autofocus style="text-align:center; letter-spacing: 2px;">
                        <div id="admin-auth-error" style="color:#ff6b8b; font-size:11px; display:none;"></div>
                        <div class="confirm-modal-actions" style="margin-top:6px;">
                            <button type="submit" class="confirm-modal-btn confirm" id="btn-admin-login">UNLOCK</button>
                            <button type="button" class="confirm-modal-btn cancel" id="btn-admin-cancel">CANCEL</button>
                        </div>
                    </form>
                </div>
            `;

            document.body.appendChild(overlay);

            const close = () => {
                playArcadeBeep();
                overlay.remove();
                document.removeEventListener('keydown', handleKey);
            };

            const handleKey = (e) => {
                if (e.key === 'Escape') close();
            };

            document.addEventListener('keydown', handleKey);
            overlay.querySelector('#btn-admin-cancel').addEventListener('click', close);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) close();
            });

            const pwdInput = overlay.querySelector('#admin-password-input');
            pwdInput.focus();

            window.submitAdminPassword = async () => {
                playArcadeBeep();
                const pwd = pwdInput.value.trim();
                const errorEl = overlay.querySelector('#admin-auth-error');
                const submitBtn = overlay.querySelector('#btn-admin-login');

                if (!pwd) {
                    pwdInput.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'CHECKING...';
                if (errorEl) errorEl.style.display = 'none';

                try {
                    const res = await fetch('/api/admin/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pwd })
                    });

                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        throw new Error(errData.error || 'Invalid admin password.');
                    }

                    const data = await res.json();
                    setStoredAdminToken(data.token);
                    showToast('ADMIN UNLOCKED! WELCOME.');
                    overlay.remove();
                    document.removeEventListener('keydown', handleKey);

                    if (typeof onAuthenticated === 'function') {
                        onAuthenticated();
                    }
                } catch (err) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'UNLOCK';
                    if (errorEl) {
                        errorEl.textContent = err.message || 'Invalid admin password.';
                        errorEl.style.display = 'block';
                    }
                    pwdInput.focus();
                    pwdInput.select();
                }
            };
        }

        function normalizeQuests(quests) {
            if (!Array.isArray(quests)) return [];
            return quests.map((q, idx) => {
                if (typeof q === 'string') {
                    return { id: `sq-${idx}`, text: q, done: false };
                }
                return {
                    id: (q && q.id) ? q.id : `sq-${idx}`,
                    text: (q && typeof q.text === 'string') ? q.text : String(q ? q.text || '' : ''),
                    done: Boolean(q && q.done)
                };
            });
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return String(str || '');
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function loadProfileData() {
            try {
                const local = localStorage.getItem('whowho_profile_data');
                if (local) {
                    const parsed = JSON.parse(local);
                    if (parsed && typeof parsed === 'object') {
                        currentProfileData = Object.assign({}, defaultProfileData, parsed);
                        currentProfileData.knowMe = Object.assign({}, defaultProfileData.knowMe, parsed.knowMe || {});
                        currentProfileData.ultBias = Object.assign({}, defaultProfileData.ultBias, parsed.ultBias || {});
                        currentProfileData.ultGroups = Object.assign({}, defaultProfileData.ultGroups, parsed.ultGroups || {});
                        if (Array.isArray(parsed.knownFacts)) currentProfileData.knownFacts = parsed.knownFacts;
                        if (Array.isArray(parsed.unknownFacts)) currentProfileData.unknownFacts = parsed.unknownFacts;
                        if (Array.isArray(parsed.hobbies)) currentProfileData.hobbies = parsed.hobbies;
                        if (!Array.isArray(currentProfileData.hobbies) || currentProfileData.hobbies.length === 0) currentProfileData.hobbies = [...defaultProfileData.hobbies];
                        if (Array.isArray(parsed.sidequests)) currentProfileData.sidequests = normalizeQuests(parsed.sidequests);
                    }
                }
            } catch {}

            try {
                const res = await fetch('/api/profile', { cache: 'no-store' });
                if (res.ok) {
                    const json = await res.json();
                    if (json && json.success && json.profile && typeof json.profile === 'object') {
                        const s = json.profile;
                        currentProfileData = Object.assign({}, defaultProfileData, s);
                        currentProfileData.knowMe = Object.assign({}, defaultProfileData.knowMe, s.knowMe || {});
                        currentProfileData.ultBias = Object.assign({}, defaultProfileData.ultBias, s.ultBias || {});
                        currentProfileData.ultGroups = Object.assign({}, defaultProfileData.ultGroups, s.ultGroups || {});
                        if (Array.isArray(s.knownFacts)) currentProfileData.knownFacts = s.knownFacts;
                        if (Array.isArray(s.unknownFacts)) currentProfileData.unknownFacts = s.unknownFacts;
                        if (Array.isArray(s.hobbies)) currentProfileData.hobbies = s.hobbies;
                        if (!Array.isArray(currentProfileData.hobbies) || currentProfileData.hobbies.length === 0) currentProfileData.hobbies = [...defaultProfileData.hobbies];
                        if (Array.isArray(s.sidequests)) currentProfileData.sidequests = normalizeQuests(s.sidequests);
                        try {
                            localStorage.setItem('whowho_profile_data', JSON.stringify(currentProfileData));
                        } catch {}

                        const hash = (window.location.hash || '').replace(/^#/, '').trim();
                        if (DETAIL_PAGES.includes(hash) && !editingSection) {
                            renderDetail(hash, false);
                        } else if (hash === 'sidequests' && !isEditingSideQuests) {
                            renderPage('sidequests', false);
                        }
                    }
                }
            } catch (err) {
                console.warn('Profile sync notice:', err);
            }
        }

        async function saveProfileToServer(data) {
            const token = getStoredAdminToken();
            try {
                const res = await fetch('/api/profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : ''
                    },
                    body: JSON.stringify(data)
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        showToast('ADMIN AUTH REQUIRED TO SAVE.');
                        showAdminPasswordModal('Admin authentication expired or required. Enter password to save:', () => {
                            saveProfileToServer(data);
                        });
                    }
                }
            } catch (err) {
                console.warn('Profile save warning:', err);
            }
        }

        function showConfirmationModal(title, message, onConfirm) {
            playArcadeBeep();
            const existing = document.getElementById('profile-confirm-modal');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.id = 'profile-confirm-modal';
            overlay.className = 'confirm-modal-overlay';
            overlay.innerHTML = `
                <div class="confirm-modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                    <h3 class="confirm-modal-title" id="modal-title">${escapeHtml(title)}</h3>
                    <p class="confirm-modal-desc">${escapeHtml(message)}</p>
                    <div class="confirm-modal-actions">
                        <button type="button" class="confirm-modal-btn confirm" id="modal-confirm-btn">CONFIRM</button>
                        <button type="button" class="confirm-modal-btn cancel" id="modal-cancel-btn">CANCEL</button>
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);

            const close = () => {
                playArcadeBeep();
                overlay.remove();
                document.removeEventListener('keydown', handleKey);
            };

            const handleKey = (e) => {
                if (e.key === 'Escape') close();
            };

            overlay.querySelector('#modal-confirm-btn').addEventListener('click', () => {
                playArcadeBeep();
                overlay.remove();
                document.removeEventListener('keydown', handleKey);
                if (typeof onConfirm === 'function') onConfirm();
            });

            overlay.querySelector('#modal-cancel-btn').addEventListener('click', close);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) close();
            });
            document.addEventListener('keydown', handleKey);
        }

        function showToast(message) {
            const existing = document.querySelector('.profile-save-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'profile-save-toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2800);
        }

        function toggleEditProfile(sectionKey) {
            playArcadeBeep();
            if (!isAdminLoggedIn) {
                showAdminPasswordModal('Only the owner of the website can edit profile options.', () => {
                    editingSection = sectionKey;
                    renderDetail(sectionKey, false);
                });
                return;
            }
            editingSection = sectionKey;
            renderDetail(sectionKey, false);
        }

        function cancelEditProfile(sectionKey) {
            playArcadeBeep();
            editingSection = null;
            isEditingSideQuests = false;
            renderDetail(sectionKey, false);
        }

        function switchUltTab(targetSection) {
            playArcadeBeep();
            editingSection = null;
            isEditingSideQuests = false;
            history.replaceState({ screen: 'detail', detail: targetSection }, '', `#${targetSection}`);
            renderDetail(targetSection, false);
        }

        function promptSaveProfile(sectionKey) {
            const form = document.getElementById(`form-${sectionKey}`);
            if (!form) return;

            showConfirmationModal(
                'SAVE CHANGES?',
                'Are you sure you want to save your updated profile information?',
                () => {
                    const formData = new FormData(form);

                    if (sectionKey === 'knowMe') {
                        currentProfileData.knowMe = {
                            name: (formData.get('name') || '').trim(),
                            nickname: (formData.get('nickname') || '').trim(),
                            age: (formData.get('age') || '').trim(),
                            country: (formData.get('country') || '').trim(),
                            timezone: (formData.get('timezone') || '').trim(),
                            pronouns: (formData.get('pronouns') || '').trim()
                        };
                    } else if (sectionKey === 'knownFacts') {
                        const text = (formData.get('facts') || '').trim();
                        currentProfileData.knownFacts = text.split('\n').map(l => l.trim()).filter(Boolean);
                    } else if (sectionKey === 'unknownFacts') {
                        const text = (formData.get('facts') || '').trim();
                        currentProfileData.unknownFacts = text.split('\n').map(l => l.trim()).filter(Boolean);
                    } else if (sectionKey === 'hobbies') {
                        const text = (formData.get('facts') || formData.get('hobbies') || '').trim();
                        currentProfileData.hobbies = text.split('\n').map(l => l.trim()).filter(Boolean);
                    } else if (sectionKey === 'ultBias') {
                        currentProfileData.ultBias = {
                            kpop: (formData.get('kpop') || '').trim(),
                            thaiGl: (formData.get('thaiGl') || '').trim(),
                            ppop: (formData.get('ppop') || '').trim(),
                            other: (formData.get('other') || '').trim()
                        };
                    } else if (sectionKey === 'ultGroups') {
                        currentProfileData.ultGroups = {
                            mainUlt: (formData.get('mainUlt') || '').trim(),
                            stanGroups: (formData.get('stanGroups') || '').trim(),
                            boyGroups: (formData.get('boyGroups') || '').trim()
                        };
                    }

                    try {
                        localStorage.setItem('whowho_profile_data', JSON.stringify(currentProfileData));
                    } catch {}

                    saveProfileToServer(currentProfileData);
                    editingSection = null;
            isEditingSideQuests = false;
                    showToast('PROFILE UPDATED SUCCESSFULLY!');
                    renderDetail(sectionKey, false);
                }
            );
        }

        window.toggleEditProfile = toggleEditProfile;
        window.cancelEditProfile = cancelEditProfile;
        window.promptSaveProfile = promptSaveProfile;
        window.switchUltTab = switchUltTab;

        function getProfileSectionContent(sectionKey) {
            const isEditing = editingSection === sectionKey;

        function playArcadeBeep(frequency = 620, endFreq = 330, duration = 0.09, type = 'square') {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                arcadeAudioContext ||= new AudioCtx();
                if (arcadeAudioContext.state === 'suspended') {
                    arcadeAudioContext.resume().catch(() => {});
                }
                const oscillator = arcadeAudioContext.createOscillator();
                const gain = arcadeAudioContext.createGain();
                const startTime = arcadeAudioContext.currentTime;

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, startTime);
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(10, endFreq), startTime + duration * 0.85);
                gain.gain.setValueAtTime(0.0001, startTime);
                gain.gain.exponentialRampToValueAtTime(0.12, startTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
                oscillator.connect(gain);
                gain.connect(arcadeAudioContext.destination);
                oscillator.start(startTime);
                oscillator.stop(startTime + duration + 0.01);
            } catch {}
        }

        function stopLanyardRefresh() {
            if (lanyardRefreshTimer) {
                clearInterval(lanyardRefreshTimer);
                lanyardRefreshTimer = undefined;
            }
            if (lanyardReconnectTimer) {
                clearTimeout(lanyardReconnectTimer);
                lanyardReconnectTimer = null;

            disconnectLanyardSocket();
            disconnectDirectStream();
            stopTrackProgress();

        let isMonitoringNowPlaying = false;
        let lanyardReconnectTimer = null;
        let directEventSource = null;

        function disconnectLanyardSocket() {
            if (lanyardHeartbeatTimer) {
                clearInterval(lanyardHeartbeatTimer);
                lanyardHeartbeatTimer = null;
            }
            if (lanyardSocket) {
                try {
                    lanyardSocket.onclose = null;
                    lanyardSocket.onerror = null;
                    lanyardSocket.close();
                } catch {}
                lanyardSocket = null;
            }
        }

        function disconnectDirectStream() {
            if (directEventSource) {
                try {
                    directEventSource.close();

        function syncDirectTrackWithLanyard(presence) {
            if (!presence) return;
            if (presence.listening_to_spotify && presence.spotify && presence.spotify.song) {
                if (latestDirectTrack && latestDirectTrack.source && latestDirectTrack.source.toLowerCase() === 'spotify') {
                    if (latestDirectTrack.title.toLowerCase() !== presence.spotify.song.toLowerCase()) {
                        latestDirectTrack = null;
                    }
                }
            }
            if (Array.isArray(presence.activities)) {
                for (const act of presence.activities) {
                    const parsed = parseMusicActivity(act);
                    if (parsed && latestDirectTrack && latestDirectTrack.source &&
                        latestDirectTrack.source.toLowerCase() === parsed.source.toLowerCase()) {
                        if (latestDirectTrack.title.toLowerCase() !== parsed.title.toLowerCase()) {
                            latestDirectTrack = null;
                        }
                    }
                }
            }
        }

        function connectDirectStream() {
            if (typeof EventSource === 'undefined') return;
            if (directEventSource) return;

            try {
                directEventSource = new EventSource('/api/now-playing/stream');
                directEventSource.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data) {
                            latestDirectTrack = data.isPlaying ? data : null;
                            renderUnifiedMusic();
                        }
                    } catch {}
                };
                directEventSource.onerror = () => {
                    if (directEventSource) {
                        directEventSource.close();
                        directEventSource = null;
                    }
                };
            } catch {}
        }

        function connectLanyardSocket() {
            if (typeof WebSocket === 'undefined') return;
            if (lanyardSocket && (lanyardSocket.readyState === WebSocket.OPEN || lanyardSocket.readyState === WebSocket.CONNECTING)) {
                return;
            }

            try {
                lanyardSocket = new WebSocket('wss://api.lanyard.rest/socket');

                lanyardSocket.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        const { op, t, d } = message;

                        if (op === 1) { // Hello
                            const heartbeatInterval = d.heartbeat_interval || 30000;
                            if (lanyardSocket && lanyardSocket.readyState === WebSocket.OPEN) {
                                lanyardSocket.send(JSON.stringify({
                                    op: 2,
                                    d: {
                                        subscribe_to_id: DISCORD_USER_ID
                                    }
                                }));
                            }

                            if (lanyardHeartbeatTimer) clearInterval(lanyardHeartbeatTimer);
                            lanyardHeartbeatTimer = setInterval(() => {
                                if (lanyardSocket && lanyardSocket.readyState === WebSocket.OPEN) {
                                    lanyardSocket.send(JSON.stringify({ op: 3 }));
                                }
                            }, heartbeatInterval);
                        } else if (op === 0) { // Event
                            if (t === 'INIT_STATE' || t === 'PRESENCE_UPDATE') {
                                latestLanyardPresence = d;
                                syncDirectTrackWithLanyard(d);
                                renderUnifiedMusic();
                            }
                        }
                    } catch (err) {
                        console.warn('Lanyard socket message parse warning:', err);
                    }
                };

                lanyardSocket.onopen = () => {
                    if (lanyardReconnectTimer) {
                        clearTimeout(lanyardReconnectTimer);
                        lanyardReconnectTimer = null;
                    }
                };

                lanyardSocket.onerror = (err) => {
                    console.warn('Lanyard WebSocket notice:', err);
                };

                lanyardSocket.onclose = () => {
                    if (lanyardHeartbeatTimer) {
                        clearInterval(lanyardHeartbeatTimer);
                        lanyardHeartbeatTimer = null;
                    }
                    lanyardSocket = null;
                    if (isMonitoringNowPlaying) {
                        if (lanyardReconnectTimer) clearTimeout(lanyardReconnectTimer);
                        lanyardReconnectTimer = setTimeout(() => {
                            if (isMonitoringNowPlaying) connectLanyardSocket();
                        }, 1500);
                    }
                };
            } catch (err) {
                console.warn('Unable to initialize Lanyard WebSocket:', err);
            }
        }

        let isPrefetching = false;
        async function prefetchNowPlaying() {
            if (isPrefetching) return;
            isPrefetching = true;
            try {
                const fetchWithTimeout = async (url, timeoutMs) => {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), timeoutMs);
                    try {
                        const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
                        clearTimeout(timer);
                        return res.ok ? await res.json() : null;
                    } catch {
                        clearTimeout(timer);
                        return null;
                    }
                };

                const [lanyardData, directData] = await Promise.all([
                    fetchWithTimeout(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`, 4000),
                    fetchWithTimeout('/api/now-playing', 4000)
                ]);

                if (lanyardData && lanyardData.success && lanyardData.data) {
                    latestLanyardPresence = lanyardData.data;
                    syncDirectTrackWithLanyard(lanyardData.data);
                }
                if (directData) {
                    latestDirectTrack = directData.isPlaying ? directData : null;
                }

                const musicList = document.getElementById('lanyard-music-list');
                if (musicList && (latestDirectTrack || latestLanyardPresence)) {
                    renderUnifiedMusic();
                }
            } catch (err) {
                console.warn('Prefetch notice:', err);
            } finally {
                isPrefetching = false;
            }
        }

        function startLanyardMonitoring() {
            stopLanyardRefresh();
            isMonitoringNowPlaying = true;
            const musicList = document.getElementById('lanyard-music-list');

            if (latestDirectTrack || latestLanyardPresence) {
                renderUnifiedMusic();
            } else if (musicList) {
                musicList.innerHTML = '<p class="lanyard-activity">CONNECTING TO AUDIO STREAM...</p>';
                musicList.hidden = false;
            }

            isLoadingLanyard = false;
            fetchLanyardPresence();
            connectLanyardSocket();
            connectDirectStream();
            lanyardRefreshTimer = setInterval(fetchLanyardPresence, 2000);
        }

        function stopTrackProgress() {
            if (trackProgressTimer) {
                clearInterval(trackProgressTimer);

        function formatTrackTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateTrackProgress() {
            document.querySelectorAll('.lanyard-track-timing[data-start][data-end]').forEach(timing => {
                const startedAt = Number(timing.dataset.start);
                const endsAt = Number(timing.dataset.end);
                const durationSeconds = Math.floor((endsAt - startedAt) / 1000);
                const elapsedSeconds = Math.min(durationSeconds, Math.max(0, Math.floor((Date.now() - startedAt) / 1000)));
                const progressPercent = durationSeconds > 0 ? (elapsedSeconds / durationSeconds) * 100 : 0;
                const elapsedTime = timing.querySelector('[data-elapsed-time]');
                const totalTime = timing.querySelector('[data-total-time]');
                const progress = timing.querySelector('[role="progressbar"]');
                const progressFill = timing.querySelector('.lanyard-track-progress-fill');

                if (!elapsedTime || !totalTime || !progress || !progressFill || durationSeconds <= 0) return;

                elapsedTime.textContent = formatTrackTime(elapsedSeconds);
                totalTime.textContent = formatTrackTime(durationSeconds);
                progress.setAttribute('aria-valuenow', String(Math.round(progressPercent)));
                progressFill.style.width = `${progressPercent}%`;
                timing.hidden = false;

                // Instant detection when track ends: query next track immediately
                if (elapsedSeconds >= durationSeconds) {
                    if (!timing.dataset.trackEnded) {
                        timing.dataset.trackEnded = 'true';
                        fetchLanyardPresence();
                        setTimeout(fetchLanyardPresence, 1200);
                    }
                }
            });
        }

        const DISCORD_USER_ID = '772073053097033741';
        const albumCache = new Map();

        async function fetchAlbumForTrack(artist, title) {
            const cleanArtist = (artist || '').trim();
            const cleanTitle = (title || '').trim();
            if (!cleanArtist || !cleanTitle) return null;
            const key = `${cleanArtist.toLowerCase()} - ${cleanTitle.toLowerCase()}`;
            if (albumCache.has(key)) return albumCache.get(key);

            try {
                const query = encodeURIComponent(`${cleanArtist} ${cleanTitle}`);
                const response = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                if (!response.ok) return null;
                const result = await response.json();
                const albumName = result.results?.[0]?.collectionName || null;
                albumCache.set(key, albumName);
                return albumName;
            } catch {
                return null;
            }
        }

        function resolveDiscordAssetUrl(applicationId, assetId) {
            if (!assetId || typeof assetId !== 'string') {
                return { url: null, fallback: null };
            }
            if (assetId.startsWith('spotify:')) {
                return { url: `https://i.scdn.co/image/${assetId.slice('spotify:'.length)}`, fallback: null };
            }
            if (assetId.startsWith('youtube:')) {
                return { url: `https://i.ytimg.com/vi/${assetId.slice('youtube:'.length)}/hqdefault.jpg`, fallback: null };
            }
            if (assetId.startsWith('mp:external/')) {
                const proxyUrl = `https://media.discordapp.net/external/${assetId.slice('mp:external/'.length)}`;
                let directUrl = null;
                const match = assetId.match(/^mp:external\/[^/]+\/(https?)\/(.+)$/);
                if (match) {
                    try {
                        directUrl = `${match[1]}://${decodeURIComponent(match[2])}`;
                    } catch {
                        directUrl = `${match[1]}://${match[2]}`;
                    }
                }
                return { url: proxyUrl, fallback: directUrl };
            }
            if (assetId.startsWith('http://') || assetId.startsWith('https://')) {
                return { url: assetId, fallback: null };
            }
            if (applicationId) {
                return {
                    url: `https://cdn.discordapp.com/app-assets/${applicationId}/${assetId}.png`,
                    fallback: `https://cdn.discordapp.com/app-assets/${applicationId}/${assetId}.webp`
                };
            }
            return { url: null, fallback: null };
        }

        function parseMusicActivity(activity) {
            if (!activity) return null;

            const name = (activity.name || '').trim();
            const nameLower = name.toLowerCase();
            const details = (activity.details || '').trim();
            const state = (activity.state || '').trim();
            const detailsUrl = (activity.details_url || '').trim();
            const appId = String(activity.application_id || '');
            const actType = activity.type;
            const statusDisplay = activity.status_display_type;

            const buttons = Array.isArray(activity.buttons) ? activity.buttons : [];
            const buttonTexts = [];
            const buttonUrls = [];
            for (const b of buttons) {
                if (typeof b === 'string') {
                    buttonTexts.push(b.toLowerCase());
                } else if (b && typeof b === 'object') {
                    if (b.label) buttonTexts.push(String(b.label).toLowerCase());
                    if (b.url) buttonUrls.push(String(b.url).toLowerCase());
                }
            }

            const largeImage = String(activity.assets?.large_image || '');
            const largeText = (activity.assets?.large_text || '').trim();
            const smallText = (activity.assets?.small_text || '').trim();

            const isBitChord = appId === '1543679166967193620' ||
                               nameLower.includes('bitchord') ||
                               buttonTexts.some(t => t.includes('bitchord')) ||
                               detailsUrl.toLowerCase().includes('bitchord');

            const isYouTubeMusic = nameLower.includes('youtube music') ||
                                   nameLower.includes('yt music') ||
                                   detailsUrl.toLowerCase().includes('music.youtube.com') ||
                                   buttonUrls.some(u => u.includes('music.youtube.com')) ||
                                   buttonTexts.some(t => t.includes('youtube music'));

            const isSpotify = nameLower.includes('spotify') ||
                              String(activity.id || '').startsWith('spotify:') ||
                              largeImage.startsWith('spotify:') ||
                              detailsUrl.toLowerCase().includes('open.spotify.com');

            const isListeningType = actType === 2 || statusDisplay === 2;
            const isOtherMusic = /apple music|soundcloud|tidal|deezer|musicbee|foobar2000|cider|aimp|winamp|vlc/i.test(name);

            if (!isBitChord && !isYouTubeMusic && !isSpotify && !isListeningType && !isOtherMusic) {
                return null;
            }

            let source = 'Music';
            if (isBitChord) {
                source = 'BitChord';
            } else if (isYouTubeMusic) {
                source = 'YouTube Music';
            } else if (isSpotify) {
                source = 'Spotify';
            } else if (name) {
                source = name;
            }

            let title = details || state || name;
            title = title.replace(/^listening to\s+/i, '').trim();

            let artist = '';
            if (details && state && details !== state) {
                artist = state.replace(/^by\s+/i, '').trim();
            }

            let album = '';
            const candidateAlbum = largeText || smallText;
            if (candidateAlbum &&
                candidateAlbum.toLowerCase() !== nameLower &&
                !/^(youtube music|bitchord|spotify)$/i.test(candidateAlbum) &&
                candidateAlbum !== title &&
                candidateAlbum !== artist) {
                album = candidateAlbum;
            }

            const { url: artworkUrl, fallback: fallbackArtworkUrl } = resolveDiscordAssetUrl(
                activity.application_id,
                activity.assets?.large_image
            );

            let url = detailsUrl || '';
            if (!url && buttonUrls.length > 0) {
                url = buttonUrls[0];
            }
            if (!url) {
                const searchQuery = encodeURIComponent(`${title} ${artist}`.trim());
                if (isYouTubeMusic || isBitChord) {
                    url = `https://music.youtube.com/search?q=${searchQuery}`;
                } else if (isSpotify) {
                    url = `https://open.spotify.com/search/${searchQuery}`;
                } else if (title) {
                    url = `https://www.google.com/search?q=${encodeURIComponent(`${source} ${title} ${artist}`.trim())}`;
                }
            }

            return {
                source,
                title,
                artist,
                album,
                artworkUrl,
                fallbackArtworkUrl,
                url,
                timestamps: activity.timestamps || null
            };
        }

        function createMusicCard(track) {
            const card = document.createElement('article');
            card.className = 'lanyard-music-card';
            if (!track.artworkUrl) {
                card.classList.add('no-art');
            }

            const sourceLabel = document.createElement('span');
            sourceLabel.className = 'lanyard-source-label';
            sourceLabel.textContent = `PLAYING IN ${track.source.toUpperCase()}`;
            card.appendChild(sourceLabel);

            if (track.artworkUrl) {
                const albumArt = document.createElement('img');
                albumArt.className = 'lanyard-album-art';
                albumArt.alt = `${track.source} album art`;
                albumArt.src = track.artworkUrl;
                albumArt.onerror = () => {
                    if (track.fallbackArtworkUrl && albumArt.src !== track.fallbackArtworkUrl) {
                        albumArt.src = track.fallbackArtworkUrl;
                        return;
                    }
                    albumArt.hidden = true;
                    card.classList.add('no-art');
                    console.error(`Unable to load ${track.source} album artwork.`);
                };
                card.appendChild(albumArt);
            }

            const trackInfo = document.createElement('div');
            trackInfo.className = 'lanyard-track-info';

            const trackTitle = document.createElement(track.url ? 'a' : 'p');
            trackTitle.className = 'lanyard-track-link';
            trackTitle.textContent = track.title || `Listening on ${track.source}`;
            if (track.url) {
                trackTitle.href = track.url;
                trackTitle.target = '_blank';
                trackTitle.rel = 'noopener noreferrer';
            }
            trackInfo.appendChild(trackTitle);

            if (track.artist || track.album) {
                const trackDetails = document.createElement('div');
                trackDetails.className = 'lanyard-track-details';
                if (track.artist) {
                    const artist = document.createElement('span');
                    artist.className = 'lanyard-track-artists';
                    artist.textContent = track.artist;
                    trackDetails.appendChild(artist);
                }
                if (track.album) {
                    const album = document.createElement('span');
                    album.className = 'lanyard-track-album-line';
                    album.textContent = track.album;
                    trackDetails.appendChild(album);
                } else if (track.artist && track.title) {
                    fetchAlbumForTrack(track.artist, track.title).then(albumName => {
                        if (albumName && !trackDetails.querySelector('.lanyard-track-album-line')) {
                            track.album = albumName;
                            const album = document.createElement('span');
                            album.className = 'lanyard-track-album-line';
                            album.textContent = albumName;
                            trackDetails.appendChild(album);
                        }
                    });
                }
                trackInfo.appendChild(trackDetails);
            }

            const timestamps = track.timestamps || {};
            const startedAt = Number(timestamps.start);
            const endsAt = Number(timestamps.end);
            const hasTiming = Number.isFinite(startedAt) && Number.isFinite(endsAt) && startedAt > 0 && endsAt > startedAt;
            if (hasTiming) {
                const timing = document.createElement('div');
                timing.className = 'lanyard-track-timing';
                timing.dataset.start = String(startedAt);
                timing.dataset.end = String(endsAt);

                const elapsedTime = document.createElement('span');
                elapsedTime.dataset.elapsedTime = '';
                elapsedTime.textContent = '00:00';

                const progress = document.createElement('div');
                progress.className = 'lanyard-track-progress';
                progress.setAttribute('role', 'progressbar');
                progress.setAttribute('aria-label', `${track.source} track progress`);
                progress.setAttribute('aria-valuemin', '0');
                progress.setAttribute('aria-valuemax', '100');
                progress.setAttribute('aria-valuenow', '0');

                const progressFill = document.createElement('span');
                progressFill.className = 'lanyard-track-progress-fill';
                progress.appendChild(progressFill);

                const totalTime = document.createElement('span');
                totalTime.dataset.totalTime = '';
                totalTime.textContent = '00:00';

                timing.append(elapsedTime, progress, totalTime);
                trackInfo.appendChild(timing);
            }

            card.appendChild(trackInfo);
            return { element: card, hasTiming };
        }

        function renderNoMusic(musicList, presence, customMessage) {
            if (!musicList) return;

            let discordStatus = 'OFFLINE';
            let discordDevice = 'DISCONNECTED';

            if (presence) {
                discordStatus = (presence.discord_status || 'offline').toUpperCase();
                const devices = [];
                if (presence.active_on_discord_desktop) devices.push('DESKTOP');
                if (presence.active_on_discord_mobile) devices.push('MOBILE');
                if (presence.active_on_discord_web) devices.push('WEB');
                discordDevice = devices.length ? devices.join(' & ') : 'STANDBY';

            musicList.innerHTML = `
                <div class="lanyard-empty-card">

                    <div class="lanyard-status-badge">
                        <span class="lanyard-status-dot ${(presence ? presence.discord_status : 'offline') || 'offline'}"></span>
                        <span>DISCORD: ${discordStatus} (${discordDevice})</span>
                    </div>

                </div>

        let latestLanyardPresence = null;
        let latestDirectTrack = null;

        function renderUnifiedMusic() {
            const musicList = document.getElementById('lanyard-music-list');
            if (!musicList) return;

            stopTrackProgress();

            const tracks = [];

            // 1. Direct Cloud API track (/api/now-playing: Spotify, YouTube Music, or BitChord without Discord)
            if (latestDirectTrack && latestDirectTrack.isPlaying && latestDirectTrack.title) {
                tracks.push({
                    source: latestDirectTrack.source || 'Music',
                    title: latestDirectTrack.title,
                    artist: latestDirectTrack.artist || '',
                    album: latestDirectTrack.album || '',
                    artworkUrl: latestDirectTrack.artworkUrl || null,
                    fallbackArtworkUrl: null,
                    url: latestDirectTrack.url || '',
                    timestamps: latestDirectTrack.timestamps || null
                });
            }

            // 2. Native Spotify integration from Discord
            if (latestLanyardPresence && latestLanyardPresence.spotify && (latestLanyardPresence.listening_to_spotify || latestLanyardPresence.spotify.song)) {
                const spotify = latestLanyardPresence.spotify;
                const isDup = tracks.some(t =>
                    t.source.toLowerCase() === 'spotify' &&
                    t.title.toLowerCase() === spotify.song.toLowerCase()
                );
                if (!isDup) {
                    tracks.push({
                        source: 'Spotify',
                        title: spotify.song,
                        artist: spotify.artist,
                        album: spotify.album,
                        artworkUrl: spotify.album_art_url,
                        fallbackArtworkUrl: null,
                        url: spotify.track_id
                            ? `https://open.spotify.com/track/${encodeURIComponent(spotify.track_id)}`
                            : 'https://open.spotify.com/',
                        timestamps: spotify.timestamps
                    });
                }
            }

            // 3. Discord Rich Presence activities (BitChord, YouTube Music, etc.)
            if (latestLanyardPresence && Array.isArray(latestLanyardPresence.activities)) {
                for (const activity of latestLanyardPresence.activities) {
                    const parsed = parseMusicActivity(activity);
                    if (!parsed) continue;

                    if (parsed.source.toLowerCase() === 'spotify' && tracks.some(t => t.source.toLowerCase() === 'spotify')) {
                        continue;
                    }

                    const isDuplicate = tracks.some(t =>
                        t.source.toLowerCase() === parsed.source.toLowerCase() &&
                        t.title.toLowerCase() === parsed.title.toLowerCase()
                    );
                    if (!isDuplicate) {
                        tracks.push(parsed);
                    }
                }
            }

            if (tracks.length > 0) {
                const cards = tracks.map(createMusicCard);
                musicList.replaceChildren(...cards.map(card => card.element));
                musicList.hidden = false;
                if (cards.some(card => card.hasTiming)) {
                    updateTrackProgress();
                    trackProgressTimer = setInterval(updateTrackProgress, 1000);
                }
            } else {
                renderNoMusic(musicList, latestLanyardPresence);
            }
        }

        async function fetchLanyardPresence() {
            const musicList = document.getElementById('lanyard-music-list');
            if (!musicList) return;

            if (isLoadingLanyard) return;
            isLoadingLanyard = true;

            try {
                const fetchWithTimeout = async (url, timeoutMs) => {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), timeoutMs);
                    try {
                        const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
                        clearTimeout(timer);
                        return res.ok ? await res.json() : null;
                    } catch {
                        clearTimeout(timer);
                        return null;
                    }
                };

                const [lanyardData, directData] = await Promise.all([
                    fetchWithTimeout(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`, 4000),
                    fetchWithTimeout('/api/now-playing', 4000)
                ]);

                if (lanyardData && lanyardData.success && lanyardData.data) {
                    latestLanyardPresence = lanyardData.data;
                    syncDirectTrackWithLanyard(lanyardData.data);
                }
                if (directData) {
                    latestDirectTrack = directData.isPlaying ? directData : null;
                }

                renderUnifiedMusic();
            } catch (error) {
                stopTrackProgress();
                if (!musicList.children.length || musicList.querySelector('.lanyard-empty-card') || musicList.querySelector('.lanyard-activity')) {
                    renderNoMusic(musicList, latestLanyardPresence, 'Unable to connect to music services.');
                }
                console.warn('Music presence fetch notice:', error);
            } finally {
                isLoadingLanyard = false;
            }
        }

        async function sendMessageToCreator() {
            const textarea = document.getElementById('message-input');
            const message = textarea ? textarea.value.trim() : '';

            if (!textarea || !message) {
                if (textarea) {
                    textarea.focus();
                }
                return;
            }

            try {
                textarea.value = '';

                const response = await fetch('/api/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Unable to send message.');
                }
            } catch (error) {
                textarea.value = message;
                textarea.placeholder = 'Failed to send. Please try again.';
                console.error(error);
            }
        }
