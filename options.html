<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whoami Music Bridge</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 24px; width: 320px; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { box-sizing: border-box; padding: 8px; width: 100%; }
    button { margin-top: 16px; padding: 8px 12px; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Whoami Music Bridge</h1>
  <label for="endpoint">Website URL</label>
  <input id="endpoint" type="url" value="https://whowho-website.vercel.app" autocomplete="url">
  <label for="token">Publishing token</label>
  <input id="token" type="password" autocomplete="off">
  <button id="save" type="button">Save settings</button>
  <p id="status" role="status"></p>
  <script src="options.js"></script>
</body>
</html>
