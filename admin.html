<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <title>Creator Messages</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      letter-spacing: 1px;
    }

    .admin-shell {
      width: min(980px, 100%);
      border: 3px solid #004cff;
      background: rgba(0, 0, 0, 0.78);
      box-shadow: 0 0 12px #004cff, 0 0 24px rgba(0, 76, 255, 0.5), inset 0 0 10px rgba(0, 76, 255, 0.18);
      border-radius: 12px;
      padding: 28px 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 32px);
      color: #ffffff;
      text-shadow: 0 0 8px #ffffff;
      text-transform: uppercase;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      background: transparent;
      border: 2px solid #004cff;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 76, 255, 0.28);
      transition: transform 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover,
    button:focus {
      color: #004cff;
      transform: translateX(3px);
      text-shadow: 0 0 8px #004cff;
      box-shadow: 0 0 12px rgba(0, 76, 255, 0.8);
    }

    .message-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 260px;
    }

    .message-card {
      border: 2px solid #004cff;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 0 8px rgba(0, 76, 255, 0.12);
      border-radius: 10px;
      padding: 16px;
    }

    .message-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      color: #9ab7ff;
      margin-bottom: 12px;
      line-height: 1.7;
      flex-wrap: wrap;
    }

    .message-text {
      white-space: pre-wrap;
      color: #ffffff;
      line-height: 1.9;
      font-size: 12px;
    }

    .delete-btn {
      background: rgba(255, 255, 255, 0.02);
      border-color: #ff4d4d;
      color: #ffb1b1;
      box-shadow: 0 0 8px rgba(255, 77, 77, 0.25);
    }

    .delete-btn:hover,
    .delete-btn:focus {
      color: #ff4d4d;
      text-shadow: 0 0 8px #ff4d4d;
      box-shadow: 0 0 10px rgba(255, 77, 77, 0.7);
    }

    .empty {
      padding: 20px;
      border: 2px dashed #004cff;
      border-radius: 10px;
      color: #cfe0ff;
      background: rgba(0, 0, 0, 0.4);
      line-height: 1.8;
      font-size: 12px;
    }

    .login-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 420px;
      margin: 20px auto 0;
    }

    .login-panel label {
      font-size: 10px;
      color: #cfe0ff;
      line-height: 1.7;
    }

    .login-panel input {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #004cff;
      border-radius: 8px;
      color: #ffffff;
      padding: 12px 14px;
      outline: none;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 12px;
      }

      .admin-shell {
        padding: 18px 14px;
      }

      .header {
        align-items: flex-start;
      }

      .message-meta {
        flex-direction: column;
        align-items: flex-start;
      }

      .message-text {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div id="login-panel" class="login-panel">
      <label for="admin-password">ADMIN PASSWORD</label>
      <input id="admin-password" type="password" placeholder="Enter password" />
      <button id="loginBtn" type="button">Open inbox</button>
      <div id="login-error" class="empty hidden"></div>
    </div>

    <div id="inbox-panel" class="hidden">
      <div class="header">
        <h1>Creator Messages</h1>
        <div class="toolbar">
          <button id="refreshBtn" type="button">Refresh</button>
          <button id="logoutBtn" type="button">Log out</button>
        </div>
      </div>

      <div id="messages" class="message-list"></div>
    </div>
  </div>

  <script>
    let adminAuth = '';
    const apiBaseUrl = 'http://localhost:3000';
    const loginPanel = document.getElementById('login-panel');
    const inboxPanel = document.getElementById('inbox-panel');
    const loginError = document.getElementById('login-error');
    const passwordInput = document.getElementById('admin-password');

    function showLogin(errorText) {
      inboxPanel.classList.add('hidden');
      loginPanel.classList.remove('hidden');
      loginError.textContent = errorText || '';
      loginError.classList.toggle('hidden', !errorText);
    }

    function showInbox() {
      loginPanel.classList.add('hidden');
      inboxPanel.classList.remove('hidden');
      loginError.textContent = '';
      loginError.classList.add('hidden');
    }

    function login() {
      const user = 'admin';
      const pass = passwordInput.value.trim();

      if (!pass) {
        showLogin('Enter the admin password.');
        return;
      }

      adminAuth = 'Basic ' + btoa(`${user}:${pass}`);
      fetchMessages();
    }

    async function fetchMessages() {
      if (!adminAuth) {
        showLogin('Access denied.');
        return;
      }

      const response = await fetch(`${apiBaseUrl}/api/messages`, {
        headers: { Authorization: adminAuth }
      });

      if (!response.ok) {
        adminAuth = '';
        passwordInput.value = '';
        showLogin('Invalid admin password.');
        return;
      }

      const messages = await response.json();
      const list = document.getElementById('messages');
      showInbox();

      if (!messages.length) {
        list.innerHTML = '<div class="empty">No messages yet.</div>';
        return;
      }

      list.innerHTML = messages.map(msg => `
        <div class="message-card" data-id="${msg.id}">
          <div class="message-meta">
            <span>${new Date(msg.createdAt).toLocaleString()}</span>
            <button class="delete-btn" type="button" data-id="${msg.id}">Delete</button>
          </div>
          <div class="message-text">${msg.text}</div>
        </div>
      `).join('');

      document.querySelectorAll('.delete-btn').forEach(button => {
        button.addEventListener('click', async (event) => {
          const id = event.target.dataset.id;
          const response = await fetch(`${apiBaseUrl}/api/messages/${id}`, {
            method: 'DELETE',
            headers: { Authorization: adminAuth }
          });

          if (response.ok) {
            fetchMessages();
          }
        });
      });
    }

    document.getElementById('loginBtn').addEventListener('click', login);
    passwordInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        login();
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', fetchMessages);
    document.getElementById('logoutBtn').addEventListener('click', () => {
      adminAuth = '';
      passwordInput.value = '';
      showLogin('');
    });

    showLogin('');
  </script>
</body>
</html>
