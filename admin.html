<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <title>Creator Messages</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      background: #000;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
    }
    .admin-shell {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 28px 24px;
      border: 3px solid #004cff;
      border-radius: 12px;
      box-shadow: 0 0 12px #004cff, 0 0 24px rgba(0, 76, 255, .5);
    }
    .empty, .message-meta { font-size: 10px; line-height: 1.7; }
    button { font: inherit; color: #fff; background: transparent; border: 2px solid #004cff; border-radius: 8px; padding: 12px 14px; cursor: pointer; font-size: 10px; }
    button:hover, button:focus { color: #004cff; box-shadow: 0 0 12px rgba(0, 76, 255, .8); }
    .header, .message-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .header { margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 32px); }
    .toolbar { display: flex; gap: 12px; }
    .toolbar a { color: #9ab7ff; align-self: center; font-size: 10px; }
    .toolbar a:hover, .toolbar a:focus { color: #004cff; }
    .message-list { display: flex; flex-direction: column; gap: 18px; }
    .sync-status { margin-bottom: 14px; color: #9ab7ff; font-size: 10px; line-height: 1.7; }
    .message-card { padding: 16px; border: 2px solid #004cff; border-radius: 10px; box-shadow: inset 0 0 8px rgba(0, 76, 255, .12); }
    .message-meta { color: #9ab7ff; margin-bottom: 12px; }
    .message-text { white-space: pre-wrap; font-size: 12px; line-height: 1.9; overflow-wrap: anywhere; }
    .delete-btn { border-color: #ff4d4d; color: #ffb1b1; }
    .empty { padding: 20px; border: 2px dashed #004cff; color: #cfe0ff; }
    @media (max-width: 600px) { body { padding: 18px 12px; } .admin-shell { padding: 18px 14px; } .message-text { font-size: 10px; } }
  </style>
</head>
<body>
  <main class="admin-shell">
    <section id="inbox-panel">
      <div class="header">
        <h1>Creator Messages</h1>
        <div class="toolbar"><button id="refreshBtn" type="button">Refresh</button><a href="/">Back to site</a></div>
      </div>
      <div id="sync-status" class="sync-status" role="status" aria-live="polite"></div>
      <div id="messages" class="message-list"></div>
    </section>
  </main>
  <script>
    const messagesList = document.getElementById('messages');
    const syncStatus = document.getElementById('sync-status');
    let refreshTimer;
    let isLoading = false;

    async function fetchMessages() {
      if (isLoading) return;
      isLoading = true;
      syncStatus.textContent = 'Syncing messages...';

      try {
        const response = await fetch('/api/messages', { credentials: 'same-origin' });
        if (response.status === 401 || response.status === 403) {
          clearInterval(refreshTimer);
          refreshTimer = undefined;
          throw new Error('Admin authentication failed. Reload the page and sign in with the Vercel admin password.');
        }
        if (!response.ok) {
          throw new Error(`Inbox request failed (${response.status}).`);
        }

        const messages = await response.json();
        if (!Array.isArray(messages)) {
          throw new Error('Inbox returned an invalid response.');
        }

        messagesList.innerHTML = messages.length ? messages.map(message => `
          <article class="message-card">
            <div class="message-meta"><span>${new Date(message.createdAt).toLocaleString()}</span><button class="delete-btn" type="button" data-id="${message.id}">Delete</button></div>
            <div class="message-text"></div>
          </article>`).join('') : '<div class="empty">No messages yet.</div>';
        messages.forEach((message, index) => { messagesList.children[index].querySelector('.message-text').textContent = message.text; });
        messagesList.querySelectorAll('.delete-btn').forEach(button => button.addEventListener('click', async () => {
          button.disabled = true;
          try {
            const response = await fetch(`/api/messages/${encodeURIComponent(button.dataset.id)}`, { method: 'DELETE', credentials: 'same-origin' });
            if (!response.ok) {
              throw new Error(`Delete failed (${response.status}).`);
            }
            await fetchMessages();
          } catch (error) {
            syncStatus.textContent = error.message || 'Unable to delete message.';
            button.disabled = false;
          }
        }));

        syncStatus.textContent = `Synced ${messages.length} message${messages.length === 1 ? '' : 's'} at ${new Date().toLocaleTimeString()}. Auto-refreshes every 5 seconds.`;
        if (!refreshTimer) {
          refreshTimer = setInterval(fetchMessages, 5000);
        }
      } catch (error) {
        syncStatus.textContent = error.message || 'Unable to sync messages. Please try again.';
      } finally {
        isLoading = false;
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', fetchMessages);
    fetchMessages();
  </script>
</body>
</html>
